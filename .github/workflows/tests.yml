name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # Boots the page in a headless DOM and exercises route derivation,
      # move-list generation, the command deck, backstage modes, failed
      # calls, the print sheet, and the self-rebuild round trip.
      - run: npm test

      # index.html is generated from ghost-light.html; fail if someone
      # edited the source without regenerating the Pages entry point.
      - run: npm run check:pages
