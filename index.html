<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Live set-piece tracker for a theatre crew: the stage manager calls a scene and every phone follows an animated ground plan of what moves where.">

<title>Ghost Light</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style id="sheet">
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
img,svg{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}

/* ---------------------------------------------------------------
   Palette: a lighting plot seen under worklights. Flat, matte,
   hard-edged. No gradients, no drop shadows, no floating cards.
   --------------------------------------------------------------- */
:root{
  /* Atkinson Hyperlegible: every letterform is shaped to be hard to
     confuse with another, which is what you want on a phone, in a
     wing, half-dark, mid-change. */
  --ui:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --display:"Atkinson Hyperlegible",system-ui,"Segoe UI",sans-serif;
  --mono:var(--mono);
  --ground:#E4E5E1; --surface:#F7F7F5; --sunk:#DCDDD8;
  --rule:#C3C6BE; --rule2:#A8ACA2;
  --ink:#14171B; --dim:#5D6470;
  --work:#8A4A00;          /* worklight amber */
  --work-ink:#FFFFFF;
  --gel-rose:#A8235A; --gel-congo:#2438A8; --gel-green:#2F6B22;
  --tape:#8A4A00;
  --stage-fill:#F1E7D2; --wing-fill:#E2E5F2; --aux-fill:#F2DFE7; --void:#D3D5CF;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#06080B; --surface:#0E1116; --sunk:#04060A;
    --rule:#1D232C; --rule2:#2C333F;
    --ink:#EDE9E0; --dim:#7C879B;
    --work:#FFB020; --work-ink:#140C00;
    --gel-rose:#FF5E8A; --gel-congo:#6E8BFF; --gel-green:#86E36B;
    --tape:#FFB020;
    --stage-fill:#191509; --wing-fill:#0D1322; --aux-fill:#1E0F1A; --void:#04060A;
  }
}
:root[data-theme="dark"]{
  --ground:#06080B; --surface:#0E1116; --sunk:#04060A;
  --rule:#1D232C; --rule2:#2C333F;
  --ink:#EDE9E0; --dim:#7C879B;
  --work:#FFB020; --work-ink:#140C00;
  --gel-rose:#FF5E8A; --gel-congo:#6E8BFF; --gel-green:#86E36B;
  --tape:#FFB020;
  --stage-fill:#191509; --wing-fill:#0D1322; --aux-fill:#1E0F1A; --void:#04060A;
}

body{
  background:var(--ground); color:var(--ink);
  font-family:var(--ui);
  font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%;
  padding-bottom:118px;
}
.mono,.tag{font-family:var(--mono);font-variant-numeric:tabular-nums}
.big{font-family:var(--display);font-weight:700;letter-spacing:-.01em}
.tag{font-size:10.5px;text-transform:uppercase;letter-spacing:.13em;color:var(--dim)}
:focus-visible{outline:2px solid var(--work);outline-offset:1px}

/* ---------------- header: a strip of spike tape ---------------- */
.hd{display:flex;align-items:center;gap:12px;padding:9px 16px;background:var(--surface);
  border-bottom:1px solid var(--rule)}
.mark{width:11px;height:11px;background:var(--tape);transform:rotate(45deg);flex:none}
.wordmark{font-family:var(--display);
  font-weight:700;font-size:16px;letter-spacing:.01em;text-transform:uppercase;line-height:1}
.prod{font-size:13px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.hd .sp{margin-left:auto}
.stat{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.11em;color:var(--dim);
  display:flex;align-items:center;gap:6px;white-space:nowrap}
.stat::before{content:"";width:6px;height:6px;background:var(--dim);flex:none}
.stat.ok::before{background:var(--gel-green)}
.stat.warn::before{background:var(--gel-rose)}
.lnk{background:none;border:0;padding:6px 4px;color:var(--dim);font-size:12px;cursor:pointer;
  text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--rule2)}
.lnk:hover{color:var(--ink)}

/* ---------------- body: ruled, asymmetric, no cards ---------------- */
.stagearea{display:grid;grid-template-columns:minmax(0,1fr) 336px;align-items:start;
  border-bottom:1px solid var(--rule)}
@media(max-width:960px){.stagearea{grid-template-columns:minmax(0,1fr)}}
.planpane{border-right:1px solid var(--rule);min-width:0}
@media(max-width:960px){.planpane{border-right:0;border-bottom:1px solid var(--rule)}}
.side{min-width:0}
.pane + .pane{border-top:1px solid var(--rule)}
.pane-hd{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--rule);
  background:var(--surface)}
.pane-hd .ttl{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.13em;color:var(--dim)}
.pane-hd .spacer{margin-left:auto}
/* Edit and Save are the same button in the same place, so the thumb
   learns one target and the label says which half of it you are in. */
.pane-hd .edittog{min-height:40px;padding:8px 18px;font-weight:700}
.pane-hd .edittog.on{background:var(--work);border-color:var(--work);color:var(--work-ink)}
.cnt{font-family:var(--mono);font-size:12px;color:var(--ink);border:1px solid var(--rule2);padding:1px 7px}
.mode{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.11em;
  padding:2px 7px;background:var(--sunk);color:var(--dim)}
.mode.live{background:var(--work);color:var(--work-ink)}
.mode.edit{background:var(--gel-green);color:var(--sunk)}
.mode.ahead{background:var(--gel-congo);color:var(--surface)}
.pad{padding:12px 14px}

/* ---------------- ground plan ---------------- */
.planwrap{overflow-x:auto;background:var(--void)}
/* The plan fits the screen it is on, and handles its own pinch and pan,
   so touch-action is off across the whole map. Scroll the page from
   outside it — the map is a fixed strip, not the length of the screen. */
svg.plan{width:100%;height:auto;aspect-ratio:1170/658;display:block;touch-action:none}
/* On a phone the plan's own 1.78:1 shape left a 210px strip with the
   whole theatre squeezed into it. Give the map a real block of screen
   and let the viewBox match that shape instead, so zooming in has
   somewhere to go. */
@media(max-width:760px){
  .planwrap{height:min(40vh,330px)}
  svg.plan{height:100%;aspect-ratio:auto}
}
.zone-fill-stage{fill:var(--stage-fill)}
.zone-fill-wing{fill:var(--wing-fill)}
.zone-fill-aux{fill:var(--aux-fill)}
.zone-edge{fill:none;stroke:var(--rule2);stroke-width:1.5}
.zone-edge.stage{stroke:var(--work);stroke-opacity:.65}
.zone-edge.wing{stroke:var(--gel-congo);stroke-opacity:.55}
.zone-edge.aux{stroke:var(--gel-rose);stroke-opacity:.6}
.zone-name{font-family:var(--display);font-weight:700;
  font-size:12px;letter-spacing:.08em;text-transform:uppercase;fill:var(--dim)}
.grid-line{stroke:var(--rule2);stroke-dasharray:2 6;stroke-width:1;opacity:.7}
.grid-tag{font-family:var(--mono);font-size:10px;fill:var(--dim);opacity:.65}
.house{fill:none;stroke:var(--rule2);stroke-width:1;stroke-dasharray:2 7}
.house-tag{font-family:var(--display);font-weight:700;
  font-size:11px;letter-spacing:.12em;fill:var(--dim);opacity:.75}
.curtain{fill:var(--gel-rose);opacity:.8}
.curtain-rod{stroke:var(--rule2);stroke-width:1.5;opacity:.6}
.route{fill:none;stroke:var(--work);stroke-width:2.5;stroke-dasharray:7 5;opacity:.9}
.route.dim{stroke:var(--dim);opacity:.25}
.pc{cursor:pointer}
.pc.grab{cursor:grab}
/* Resize handle. The visible square is small enough not to hide the
   piece; the transparent square under it is a thumb-sized target. */
.pc.dragging{cursor:grabbing}
.pc.dragging rect{stroke:var(--work);stroke-width:2.5}
.pc.dragging .cap{fill:var(--work)}
.pc .hgrip{fill:transparent;cursor:nwse-resize}
.pc .hdot{fill:var(--work);stroke:var(--work-ink);stroke-width:1.5;pointer-events:none}
.pc rect{stroke-width:1.5}
.pc .cap{font-family:var(--mono);font-size:10.5px;pointer-events:none}
.pc .halo{fill:none;stroke:var(--work);stroke-width:2;stroke-dasharray:3 3;opacity:0}
.pc.sel .halo{opacity:1}
.pc .note-dot{fill:var(--ink);opacity:.75}
/* SVG type is in user units, so it shrinks with the plan. At phone width
   the plan draws at about a third size; these put the labels back to
   something readable. Must sit after the rules it overrides. */
@media(max-width:760px){
  .zone-name{font-size:30px;letter-spacing:.02em}
  .grid-tag{font-size:26px}
  .house-tag{font-size:28px;letter-spacing:.04em}
}

/* ---------------- moves ---------------- */
.moves{max-height:46vh;overflow:auto}
.mv{display:flex;gap:10px;align-items:flex-start;padding:9px 14px;border-bottom:1px solid var(--rule);
  cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.mv:hover{background:var(--surface)}
.mv .sw{width:4px;align-self:stretch;min-height:26px;flex:none}
.mv .txt{min-width:0;flex:1}
.mv .nm{font-size:14px;font-weight:500}
.mv .nm .verb{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.11em;
  color:var(--dim);margin-right:7px}
.mv .path{font-family:var(--mono);font-size:11.5px;color:var(--dim);margin-top:3px;
  display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.mv .path .z{white-space:nowrap}
.mv .path .via{color:var(--work)}
.mv .path .ar{opacity:.5}
.mv .hint{font-size:12px;color:var(--dim);margin-top:3px}
.empty{color:var(--dim);font-size:13px;padding:14px}

/* ---------------- forms ---------------- */
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row + .row{margin-top:9px}
input[type=text],textarea{background:var(--sunk);border:1px solid var(--rule2);border-radius:0;
  padding:7px 9px;font-size:13px;width:100%;min-width:0}
textarea{resize:vertical;min-height:56px;font-family:inherit}
label.f{display:flex;flex-direction:column;gap:4px;flex:1 1 130px}
label.f > span{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.11em;color:var(--dim)}
.btn{background:var(--sunk);border:1px solid var(--rule2);border-radius:0;padding:8px 12px;font-size:13px;
  cursor:pointer;min-height:38px}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.hot{border-color:var(--gel-rose);color:var(--gel-rose)}
.btn.go-small{background:var(--work);border-color:var(--work);color:var(--work-ink);font-weight:600}
.plist{max-height:32vh;overflow:auto;border:1px solid var(--rule)}
.pitem{display:flex;gap:9px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--rule)}
.pitem:last-child{border-bottom:0}
.pitem .sw{width:12px;height:12px;flex:none}
.pitem .nm{flex:1;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem .zn{font-family:var(--mono);font-size:10px;color:var(--dim);white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--rule2)}
.seg.zones{display:flex;flex-wrap:wrap;width:100%}
.seg.zones button{flex:1 1 auto;border-right:1px solid var(--rule2)}
.seg.zones button:last-child{border-right:0}
.seg button{border:0;background:none;padding:7px 11px;font-size:12px;cursor:pointer;min-height:36px}
.seg button.on{background:var(--work);color:var(--work-ink);font-weight:600}
.rule{height:1px;background:var(--rule);margin:13px 0}
.help{font-size:12px;color:var(--dim);line-height:1.45}

/* ---------------------------------------------------------------
   Command deck — fixed to the bottom edge of the screen.
   Fitts's law: the primary target sits ON the edge, so it is
   effectively infinitely tall and cannot be overshot. It is the
   largest thing on screen and it NEVER moves or changes slot,
   so the thumb learns one location and stops aiming.
   --------------------------------------------------------------- */
.cmd{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--rule2)}
.jump{display:flex;align-items:center;gap:10px;padding:7px 12px;border-bottom:1px solid var(--rule);
  background:var(--sunk)}
.jump .t{font-family:var(--mono);font-size:11px;color:var(--dim);flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail{display:flex;gap:0;overflow-x:auto;border-bottom:1px solid var(--rule);scrollbar-width:thin}
.sc{flex:none;border:0;border-right:1px solid var(--rule);background:none;cursor:pointer;
  padding:7px 13px;text-align:left;min-width:98px;min-height:46px}
.sc:hover{background:var(--sunk)}
.sc .n{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.08em}
.sc .t{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:148px}
.sc.cur{background:var(--sunk);box-shadow:inset 0 -3px 0 var(--gel-congo)}
.sc.livesc .n{color:var(--work)}
.sc.livesc{box-shadow:inset 0 -3px 0 var(--work)}
.sc.cur.livesc{box-shadow:inset 0 -3px 0 var(--work)}

.deck{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:10px 12px 12px;align-items:stretch}
.slotL{display:flex;gap:8px}
/* secondary targets: deliberately smaller and set apart from the
   primary, so a mis-aimed thumb lands on nothing rather than on GO */
.sec{background:var(--sunk);border:1px solid var(--rule2);cursor:pointer;
  min-width:56px;min-height:72px;padding:6px 10px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;font-size:12px;line-height:1.15}
.sec:hover:not(:disabled){border-color:var(--ink)}
.sec:disabled{opacity:.3;cursor:not-allowed}
.sec .ic{font-family:var(--mono);font-size:15px}
.sec .cap{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim)}

.go{background:var(--work);border:1px solid var(--work);color:var(--work-ink);cursor:pointer;
  min-height:72px;padding:8px 16px;display:flex;flex-direction:column;justify-content:center;gap:1px;
  text-align:left;width:100%}
.go:hover:not(:disabled){filter:brightness(1.07)}
.go:active:not(:disabled){filter:brightness(.93)}
.go:disabled{opacity:.32;cursor:not-allowed}
.go .k{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.16em;opacity:.8}
.go .v{font-family:var(--display);font-weight:700;
  font-size:23px;line-height:1;letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.go .v .num{opacity:.62;margin-right:9px}

/* crew read-out occupies the same slot as GO: same size, same place,
   but flat and unclickable so nobody taps the show forward by accident */
.readout{background:var(--sunk);border:1px solid var(--rule2);min-height:72px;padding:8px 16px;
  display:flex;flex-direction:column;justify-content:center;gap:1px}
.readout .k{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--work)}
.readout .v{font-family:var(--display);font-weight:700;
  font-size:23px;line-height:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.readout .v .num{color:var(--dim);margin-right:9px}
.readout.away{border-color:var(--gel-congo)}
.readout.away .k{color:var(--gel-congo)}

/* ---------------- modal / toast ---------------- */
.scrim{position:fixed;inset:0;background:rgba(4,6,10,.72);display:flex;align-items:center;justify-content:center;
  padding:18px;z-index:70}
.modal{background:var(--surface);border:1px solid var(--rule2);max-width:440px;width:100%;padding:20px}
.modal h3{font-family:var(--display);font-weight:700;
  font-size:20px;letter-spacing:0;text-transform:uppercase;line-height:1;margin-bottom:8px}
.pick{display:flex;flex-direction:column;gap:1px;margin-top:16px;border:1px solid var(--rule2)}
.pick button{text-align:left;padding:14px;background:var(--sunk);border:0;border-bottom:1px solid var(--rule);
  cursor:pointer;display:flex;flex-direction:column;gap:3px;min-height:56px}
.pick button:last-child{border-bottom:0}
.pick button:hover{background:var(--ground)}
.pick button b{font-size:15px}
.pick button span{font-size:12px;color:var(--dim)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:190px;background:var(--ink);color:var(--ground);
  padding:10px 15px;font-size:13px;z-index:80;max-width:88vw;text-align:center}
.hide{display:none !important}

/* ---------------------------------------------------------------
   One screen, one question: what is happening right now.
   Everything that is not the running show lives behind "More",
   so nothing competes with the scene name and the move list.
   --------------------------------------------------------------- */
.now{padding:15px 16px 16px;border-bottom:1px solid var(--rule);background:var(--surface)}
.now .k{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;
  letter-spacing:.14em;color:var(--work)}
.now .k.ahead{color:var(--gel-congo)}
.now .v{font-family:var(--display);font-weight:700;
  font-size:30px;letter-spacing:-.015em;line-height:1;margin-top:3px;text-wrap:balance}
@media(max-width:600px){.now .v{font-size:25px}}
.now .v .num{color:var(--dim);margin-right:11px}
.now .nt{font-size:13.5px;color:var(--dim);margin-top:8px;max-width:62ch}

/* the sample show says so, and offers the way out, once */
.demobar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 14px;
  background:var(--sunk);border-bottom:1px solid var(--rule);font-size:13px}
.demobar .msg{flex:1;min-width:180px;color:var(--dim)}

/* map is off by default; the list is the thing you read under pressure */
body:not(.mapon) .planpane{display:none}
body:not(.mapon) .stagearea{grid-template-columns:minmax(0,1fr)}

/* ---------------- the "More" drawer ---------------- */
.msheet{position:fixed;inset:0;z-index:75;background:rgba(4,6,10,.6);display:flex;justify-content:flex-end}
.mspanel{background:var(--ground);width:min(430px,100%);height:100%;overflow:auto;
  border-left:1px solid var(--rule2);display:flex;flex-direction:column}
.mshd{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:10px;padding:12px 14px}
.mshd .ttl{font-family:var(--display);font-weight:700;
  font-size:17px;text-transform:uppercase;letter-spacing:.01em;line-height:1;flex:1}
.msec{border-bottom:1px solid var(--rule);padding:13px 14px}
.msec > .tag{display:block;margin-bottom:9px}
/* scene list reads as a list in the drawer, not a horizontal rail */
.msec .rail{flex-wrap:wrap;overflow-x:visible;border-bottom:0;gap:1px}
.msec .sc{flex:1 1 46%;min-width:0;border:1px solid var(--rule)}
.msec .pane-hd{padding-left:0;padding-right:0;background:none;border-bottom:0}
.msec .pad{padding:0}
.msec #editcard{border:0}

/* ---------------------------------------------------------------
   Backstage dimmer. A phone at full brightness in the wings spills
   light into the house and kills night vision. Blackout also warms
   the screen toward red, which the dark-adapted eye tolerates.
   --------------------------------------------------------------- */
#dim{position:fixed;inset:0;pointer-events:none;z-index:100;background:#000;opacity:0;transition:opacity .35s}
#dim.tint{background:#2E0A00}

/* A failed call is the worst thing that can happen in a run: the SM
   thinks the show moved on and nobody else's phone did. Say it loudly
   and keep saying it until it is fixed. */
.alert{display:flex;gap:10px;align-items:center;padding:11px 14px;background:var(--gel-rose);
  color:#12040A;font-size:13px;font-weight:500;border-bottom:1px solid var(--rule2)}
.alert .msg{flex:1;min-width:0}
.alert button{background:#12040A;color:#fff;border:0;padding:8px 13px;font-size:13px;cursor:pointer;min-height:40px}

/* Paper backup. Wifi in a school theatre is not a plan. */
.sheet{display:none}
@media print{
  :root{--ground:#fff;--surface:#fff;--sunk:#fff;--ink:#000;--dim:#444;--rule:#bbb;--rule2:#777;--work:#000}
  body{padding:0;background:#fff;color:#000}
  .hd,.stagearea,.cmd,#dim,.alert,.toast,.scrim{display:none !important}
  .sheet{display:block !important;padding:0 6mm}
  .sheet h1{font-size:24px;margin-bottom:2mm}
  .sheet .meta{font-size:11px;color:#444;margin-bottom:5mm}
  .sheet .blk{break-inside:avoid;page-break-inside:avoid;border-top:1px solid #bbb;padding:3mm 0}
  .sheet .hd2{display:flex;gap:8px;align-items:baseline}
  .sheet .no{font-size:19px;min-width:9mm}
  .sheet .nmx{font-size:16px;font-weight:600}
  .sheet .cur{font-size:11px;border:1px solid #777;padding:0 5px;margin-left:auto}
  .sheet .nt{font-size:11.5px;color:#333;margin:1mm 0 2mm}
  .sheet ol{margin:0;padding-left:6mm;font-size:12px}
  .sheet li{margin-bottom:1mm}
  .sheet .none{font-size:11.5px;color:#555;font-style:italic}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}
</style>
</head>
<body>
<div id="root">
  <header class="hd">
    <span class="mark"></span>
    <span class="wordmark">Ghost Light</span>
    <span class="prod" id="showname">—</span>

var ORDER = { aux:0, wingSR:1, stage:2, wingSL:3 };

function zoneOf(id){ return ZONES[id]; }

var MOVE_EPS = 0.05;

  if(!next || !prev) return [];
  var out = [];
  if(prev.curtain !== next.curtain){
    out.push({ kind:"curtain", text: next.curtain==="open" ? "Curtain out" : "Curtain in",
               sub: next.curtain==="open" ? "open before the scene" : "close on the scene" });
  }
  var seen = {};
  var ids = Object.keys(next.place).concat(Object.keys(prev.place));

    if(seen[id]) return; seen[id]=1;
    var p = pieceById(id); if(!p) return;
    var a = prev.place[id] || null, b = next.place[id] || null;
    if(!a && !b) return;
    if(!b){ out.push({ kind:"off", piece:p, from:a, to:null }); return; }
    if(!a){ out.push({ kind:"on", piece:p, from:null, to:b }); return; }
    if(a.zone !== b.zone){ out.push({ kind:"trav", piece:p, from:a, to:b, r:route(a,b) }); return; }
    if(Math.abs(a.x-b.x)>MOVE_EPS || Math.abs(a.y-b.y)>MOVE_EPS || (a.r||0)!==(b.r||0)){
      out.push({ kind:"shift", piece:p, from:a, to:b, r:route(a,b) });
    }
  });
  var rank = { curtain:0, trav:1, on:2, shift:3, off:4 };
  out.sort(function(m,n){ return rank[m.kind]-rank[n.kind]; });

var nodes = {};
/* Plan units per CSS pixel. The plan now stretches to whatever width it

  moves.forEach(function(m){
    if(!m.r || m.r.pts.length<2) return;
    var d = m.r.pts.map(function(p,i){ return (i?"L":"M")+p.x+" "+p.y; }).join(" ");

/* ---------- animation ---------- */
var animRAF = null;
function animateTransition(fromScene, toScene){

      var want = e*tr.total, acc = 0, pos = tr.segs[tr.segs.length-1].b;
      for(var i=0;i<tr.segs.length;i++){
        var s = tr.segs[i];
        if(want <= acc+s.len || i===tr.segs.length-1){
          var f = s.len ? (want-acc)/s.len : 1; f = Math.max(0,Math.min(1,f));
          pos = { x:s.a.x+(s.b.x-s.a.x)*f, y:s.a.y+(s.b.y-s.a.y)*f };
          break;
        }
        acc += s.len;
      }
      tr.g.setAttribute("transform","translate("+pos.x+","+pos.y+")");
    });
    if(k<1) animRAF = requestAnimationFrame(step);
    else { animRAF=null; drawPieces(toScene); drawRoutes(moves); }
  }
  tracks.forEach(function(tr){ tr.g.setAttribute("transform","translate("+tr.segs[0].a.x+","+tr.segs[0].a.y+")"); });
  setCurtain(fromScene.curtain==="open", false);
  requestAnimationFrame(function(){
    if(fromScene.curtain!==toScene.curtain) setCurtain(toScene.curtain==="open", true);
    animRAF = requestAnimationFrame(step);
  });
}

/* ---------- dragging ---------- */
var drag = null;
function svgPoint(evt){
  if(!svg.createSVGPoint || !svg.getScreenCTM) return null;
  var pt = svg.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY;
  var m = svg.getScreenCTM(); if(!m) return null;
  return pt.matrixTransform(m.inverse());
}
function hitZone(p){
  var best = null;
  Object.keys(ZONES).forEach(function(zid){
    var z = ZONES[zid];
    if(p.x>=z.x && p.x<=z.x+z.w && p.y>=z.y && p.y<=z.y+z.h) best = zid;
  });
  return best;
}
/* Edit is one button that becomes Save. Entering it forces the map on,
   because there is nothing to edit on a screen that is not showing the
   plan; leaving it publishes, so a change is never left sitting on one
   phone while the director waits. */
function startEditing(){
  if(role !== "sm"){ toast("Only the stage manager can move pieces."); return; }
  editing = true;
  if(!mapOn){ mapOn = true; LS.set("map", true); applyMap(); }
  render();
}
function stopEditing(){
  editing = false; selected = null;
  var had = dirty;
  render();
  if(had) publish();
}

var MINSZ = 16, MAXSZ = 280;

/* ---------- zoom and pan ----------
   The plan fits the screen at rest, which on a phone makes a chair
   about 14px across — fine to read, too small to place. So the map
   zooms: pinch with two fingers, or wheel on a laptop, and pan by
   dragging any empty part of the theatre. Pieces stay the same
   physical size on screen no matter the zoom, because planScale()
   is derived from the live viewBox. */
var view = { x:0, y:0, w:VB.w };
var MINZW = VB.w / 9;                 // deepest zoom: about 9x
/* The map's shape is set in CSS and differs between phone and desktop,
   so the viewBox takes its aspect from the box rather than assuming the
   plan's own. Everything below is expressed in plan units. */
function curAR(){
  var r = svg.getBoundingClientRect();
  return (r.width && r.height) ? r.height / r.width : VB.h / VB.w;
}
function fitW(){                      // the width that shows the whole theatre
  var ar = curAR(), w = VB.w;
  if(w * ar < VB.h) w = VB.h / ar;    // box is wider than the plan: fit by height
  return w;
}
function axis(v, size, total){        // centre it when it fits, clamp when it does not
  var pad = 40;
  if(size >= total) return (total - size) / 2;
  return Math.max(-pad, Math.min(total - size + pad, v));
}
function applyView(){
  var top = fitW();
  view.w = Math.max(MINZW, Math.min(top, view.w));
  var h = view.w * curAR();
  view.x = axis(view.x, view.w, VB.w);
  view.y = axis(view.y, h, VB.h);
  svg.setAttribute("viewBox", view.x+" "+view.y+" "+view.w+" "+h);
  var f = $("btn-fit");
  if(f) f.classList.toggle("hide", view.w >= top - 1);
}
function fitView(){ view.w = fitW(); applyView(); redrawForWidth(); }
/* Zoom about a fixed point, so whatever is under the fingers stays
   under the fingers. */
function zoomAbout(cx, cy, factor){
  var before = view.w;
  var want = Math.max(MINZW, Math.min(fitW(), view.w / factor));
  var k = want / before;
  view.x = cx - (cx - view.x) * k;
  view.y = cy - (cy - view.y) * k;
  view.w = want;
  applyView();
  redrawForWidth();
}
function clientToPlan(clientX, clientY){
  var r = svg.getBoundingClientRect();
  if(!r.width || !r.height) return null;
  return { x: view.x + (clientX - r.left) / r.width * view.w,
           y: view.y + (clientY - r.top) / r.height * (view.w * curAR()) };
}

var pointers = {}, pan = null, pinch = null;
function pointerList(){ return Object.keys(pointers); }
function endGestures(){ pan = null; pinch = null; }

function onPointerDown(evt){
  /* A finger that leaves the window, or a touch the browser takes back,
     can skip pointerup and leave a ghost in here forever — after which
     every single-finger drag would be read as the second half of a
     pinch. The primary pointer starts a fresh gesture, so anything
     still tracked at that moment is stale. */
  if(evt.isPrimary !== false){ pointers = {}; endGestures(); }
  pointers[evt.pointerId] = { x:evt.clientX, y:evt.clientY };
  var ids = pointerList();

  if(ids.length === 2){                       // a second finger means pinch
    drag = null; pan = null;
    var a = pointers[ids[0]], b = pointers[ids[1]];
    var mid = clientToPlan((a.x+b.x)/2, (a.y+b.y)/2);
    pinch = { d: Math.hypot(a.x-b.x, a.y-b.y), w: view.w, mid: mid };
    if(evt.preventDefault) evt.preventDefault();
    return;
  }
  if(ids.length > 2) return;

  var g = evt.target.closest ? evt.target.closest(".pc") : null;
  if(!g){                                     // empty theatre: drag to pan
    pan = { id:evt.pointerId, x:evt.clientX, y:evt.clientY, vx:view.x, vy:view.y };
    if(svg.setPointerCapture) try{ svg.setPointerCapture(evt.pointerId); }catch(e){}
    return;
  }

  var onGrip = !!(evt.target.closest && evt.target.closest(".hgrip"));
  var wasSel = selected === g.getAttribute("data-id");
  selected = g.getAttribute("data-id");
  if(!editing){ render(); return; }
  var p = svgPoint(evt);
  if(!p){ render(); return; }
  var sc = sceneAt(viewIdx), pl = sc && sc.place[selected];
  if(onGrip && wasSel && pl){
    var c = abs(pl);
    drag = { id:selected, mode:"size", cx:c.x, cy:c.y, rot:!!(pl.r||0) };
  } else {
    var c2 = pl ? abs(pl) : null;
    drag = { id:selected, mode:"move",
             ox: c2 ? c2.x - p.x : 0, oy: c2 ? c2.y - p.y : 0 };
  }
  if(svg.setPointerCapture) try{ svg.setPointerCapture(evt.pointerId); }catch(e){}
  render();
  drag.g = nodes[drag.id] || null;      // render() just rebuilt the layer
  if(drag.g && drag.mode === "move") drag.g.setAttribute("class", "pc sel grab dragging");
  if(evt.preventDefault) evt.preventDefault();
}

function sendToZone(zid){
  var sc = sceneAt(viewIdx); if(!sc || !selected) return;
  var cur = sc.place[selected] || { r:0, note:"" };
  sc.place[selected] = { zone:zid, x:0.5, y:0.5, r:cur.r||0, note:cur.note||"" };
  markDirty(); render();
}
/* "Doesn't move this scene" copies the spot forward from the previous
   scene, so diffing the two produces no move and the piece stays put in
   the wing or on the aux stage. */
function leaveAsWas(){
  var sc = sceneAt(viewIdx), prev = sceneAt(viewIdx-1);
  if(!sc || !selected) return;
  var src = prev && prev.place[selected];
  if(src){
    sc.place[selected] = { zone:src.zone, x:src.x, y:src.y, r:src.r||0, note:src.note||"" };
    toast("Stays where it was in “" + prev.name + "” — no move for the crew.");
  } else {
    sc.place[selected] = { zone:"wingSR", x:0.5, y:0.5, r:0, note:"" };
    toast("Nothing earlier to follow — parked in wing SR.");
  }
  markDirty(); render();
}
function clampSz(n){ return Math.round(Math.max(MINSZ, Math.min(MAXSZ, n))); }
/* Size lives on the piece, not the placement — a sofa is one sofa in
   every scene — so a resize here changes it everywhere, on purpose. */
function resizeTo(p){
  var pc = pieceById(drag.id); if(!pc) return;
  var dw = clampSz(Math.abs(p.x - drag.cx) * 2);
  var dh = clampSz(Math.abs(p.y - drag.cy) * 2);
  if(drag.rot){ pc.h = dw; pc.w = dh; } else { pc.w = dw; pc.h = dh; }
  drawPieces(sceneAt(viewIdx));
}

function onPointerMove(evt){
  if(pointers[evt.pointerId]) pointers[evt.pointerId] = { x:evt.clientX, y:evt.clientY };

  if(pinch){
    var ids = pointerList();
    if(ids.length < 2){ pinch = null; return; }
    var a = pointers[ids[0]], b = pointers[ids[1]];
    var d = Math.hypot(a.x-b.x, a.y-b.y);
    if(pinch.d > 0 && pinch.mid){
      var want = Math.max(MINZW, Math.min(fitW(), pinch.w * (pinch.d / d)));
      var k = want / view.w;
      view.x = pinch.mid.x - (pinch.mid.x - view.x) * k;
      view.y = pinch.mid.y - (pinch.mid.y - view.y) * k;
      view.w = want;
      applyView();
    }
    if(evt.preventDefault) evt.preventDefault();
    return;
  }

  if(pan){
    var r = svg.getBoundingClientRect();
    if(!r.width) return;
    var per = view.w / r.width;                // plan units per CSS pixel
    view.x = pan.vx - (evt.clientX - pan.x) * per;
    view.y = pan.vy - (evt.clientY - pan.y) * per;
    applyView();
    if(evt.preventDefault) evt.preventDefault();
    return;
  }

  if(!drag) return;
  var p = svgPoint(evt); if(!p) return;
  if(drag.mode === "size"){ resizeTo(p); return; }
  if(!drag.g) return;
  drag.g.setAttribute("transform","translate("+(p.x+drag.ox)+","+(p.y+drag.oy)+")");
}

function onPointerUp(evt){
  delete pointers[evt.pointerId];
  if(pinch && pointerList().length < 2){ pinch = null; redrawForWidth(); }
  if(pan && pan.id === evt.pointerId){ pan = null; redrawForWidth(); return; }
  if(!drag) return;
  var p = svgPoint(evt);
  if(drag.mode === "size"){
    if(p) resizeTo(p);
    drag = null; markDirty(); render(); return;
  }
  var sc = sceneAt(viewIdx);
  if(p){ p = { x:p.x + drag.ox, y:p.y + drag.oy }; }   // drop where the piece is, not the finger
  if(p && sc){
    var zid = hitZone(p);
    if(zid){
      var z = ZONES[zid];
      var cur = sc.place[drag.id] || { r:0, note:"" };
      sc.place[drag.id] = {
        zone: zid,
        x: Math.max(0.03, Math.min(0.97, (p.x-z.x)/z.w)),
        y: Math.max(0.03, Math.min(0.97, (p.y-z.y)/z.h)),
        r: cur.r||0, note: cur.note||""
      };
      markDirty();
    } else {
      toast("Dropped outside the theatre — put it on the stage, in a wing, or on the aux stage.");
    }
  }
  drag = null;
  render();
}
function onWheel(evt){
  if(!evt.deltaY) return;
  var pt = clientToPlan(evt.clientX, evt.clientY);
  if(!pt) return;
  if(evt.preventDefault) evt.preventDefault();
  zoomAbout(pt.x, pt.y, evt.deltaY < 0 ? 1.18 : 1/1.18);
}

/* ---------- sync ---------- */
function markDirty(){ dirty = true; LS.set("draft", { baseRev:S.rev, state:S }); paintDeck(); }
function clearDraft(){ dirty = false; LS.set("draft", null); }
function toast(msg, ms){
  var old = document.querySelector(".toast"); if(old) old.remove();
  var d = document.createElement("div"); d.className = "toast"; d.textContent = msg;
  document.body.appendChild(d);
  setTimeout(function(){ if(d.parentNode) d.remove(); }, ms||3600);
}
function syncStatus(txt, cls){
  var c = $("syncchip"); c.textContent = txt; c.className = "stat" + (cls?(" "+cls):"");
}
function syncChip(){
  if(apiState === "checking") syncStatus("Connecting");
  else if(apiState === "readonly") syncStatus("View only", "warn");
  else if(apiState === "local") syncStatus("This device only", "warn");
  else if(dirty) syncStatus("Unsaved", "warn");
  else syncStatus("Synced", "ok");
}
async function publish(){
  if(!api){ toast("No live sync in this view — the change is saved on this device only."); return false; }
  syncStatus("Sending");
  S.rev = (S.rev||1) + 1;
  try{
    await api.publish(pageSource(S));
    clearDraft();
    return true;
  }catch(err){
    S.rev = S.rev - 1;
    var code = (err && err.code) || "upstream_error";
    if(code === "conflict"){
      syncStatus("Reloading", "warn");
      toast("Someone else saved first — this device is reloading to their version.");
    } else if(code === "not_writer" || code === "not_granted" || code === "consent_required" || code === "not_declared"){
      apiState = "readonly"; api = null;
      toast("This device can view but not save. Ask whoever owns the link to send you an edit link.");
      render();
    } else if(code === "rate_limited"){
      syncStatus("Too fast", "warn");
      toast("Saving too quickly. Wait a few seconds, then try again.");
    } else if(code === "too_large"){
      syncStatus("Too big", "warn");
      toast("The show file is too large to save. Remove a few scenes or pieces.");
    } else {
      syncStatus("Save failed", "warn");
      toast("Save failed. Your work is kept on this device — try again in a moment.");
    }
    return false;
  }
}
async function callScene(i){
  if(calling) return;                       // one tap, one call
  if(i<0 || i>=S.scenes.length) return;
  S.liveIndex = i; S.liveStamp = Date.now();
  viewIdx = i; browsing = false;
  calling = true; callFail = null;
  render();
  syncStatus("Calling");
  var ok = await publish();
  calling = false;
  if(!ok) callFail = i;                     // this device moved; the others did not
  render();
}

/* ---------- backstage: keep the screen awake ---------- */
var wakeLock = null, wakeWanted = LS.get("wake", false), wakeOk = ("wakeLock" in navigator);
async function applyWake(){
  try{
    if(wakeWanted && wakeOk){
      if(!wakeLock){
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release", function(){ wakeLock = null; });
      }
    } else if(wakeLock){ await wakeLock.release(); wakeLock = null; }
  }catch(e){
    wakeWanted = false; LS.set("wake", false);
    toast("This browser will not keep the screen awake. Set your phone's auto-lock to Never for the run.");
  }
  paintHeader();
}
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState === "visible" && wakeWanted && !wakeLock) applyWake();
});

/* ---------- backstage: dim the screen ---------- */
var DIMS = [
  { label:"Bright",   a:0,    tint:false },
  { label:"Dim",      a:0.5,  tint:false },
  { label:"Blackout", a:0.78, tint:true  }
];
var dimIdx = LS.get("dim", 0), forcedDark = false;
function applyDim(){
  var d = $("dim"), s = DIMS[dimIdx];
  d.style.opacity = s.a;
  d.className = s.tint ? "tint" : "";
  if(dimIdx > 0 && !forcedDark){
    document.documentElement.setAttribute("data-theme","dark"); forcedDark = true;
  } else if(dimIdx === 0 && forcedDark){
    document.documentElement.removeAttribute("data-theme"); forcedDark = false;
  }
  paintHeader();
}

/* ---------- what is happening right now ----------
   The one thing everyone opens the app to find out, stated plainly
   and large, before any control.                                  */
function paintSceneHead(){
  var sc = sceneAt(viewIdx), box = $("scenehead");
  box.innerHTML = "";
  var k = document.createElement("div");
  k.className = "k" + (browsing ? " ahead" : "");
  k.textContent = browsing
    ? "Looking ahead — the show is on scene " + (S.liveIndex+1)
    : "On stage now";
  var v = document.createElement("div"); v.className = "v";
  v.innerHTML = '<span class="num">' + (viewIdx+1) + '</span>' + esc(sc ? sc.name : "No scenes yet");
  box.appendChild(k); box.appendChild(v);
  if(sc && sc.note){
    var n = document.createElement("div"); n.className = "nt"; n.textContent = sc.note;
    box.appendChild(n);
  }
}

/* ---------- the map is opt-in ---------- */
var mapOn = LS.get("map", false);
function applyMap(){
  document.body.classList.toggle("mapon", mapOn);
  var b = $("btn-map");
  if(b) b.textContent = mapOn ? "Hide stage map" : "Show stage map";
  if(mapOn){ fitView(); }                   // no measurable box until now
}
var reflowT = null;
function redrawForWidth(){
  var sc = sceneAt(viewIdx);
  drawPieces(sc);
  drawRoutes(movesBetween(sceneAt(viewIdx-1), sc));
}
window.addEventListener("resize", function(){

/* ---------- the More drawer ---------- */
function openMore(){ $("msheet").classList.remove("hide"); paintEditor(); }
function closeMore(){ $("msheet").classList.add("hide"); }

/* ---------- the sample show announces itself, once ---------- */

    "The demo show is cleared so you can build your own. This cannot be undone.",
    function(){
      S = { rev:S.rev, show:"My show", demo:false, liveIndex:0, liveStamp:Date.now(), pieces:[],
            scenes:[{ id:"s"+Date.now(), name:"Preshow", note:"", curtain:"closed", place:{} }] };
      viewIdx = 0; browsing = false; selected = null; callFail = null;

    }, "Clear the demo", "Cancel");
}
function paintDemoBar(){

}

/* ---------- command deck ----------
   Hick's law: during a run only three things are reachable —
   go back, go forward, look ahead. Everything else is behind a
   mode, so there is no list to read under pressure.            */
function paintDeck(){
  var isSM = role === "sm";
  var live = sceneAt(S.liveIndex), next = sceneAt(S.liveIndex+1);
  var L = $("slotL"), R = $("slotR"), J = $("jump");
  L.innerHTML = ""; R.innerHTML = "";

  function sec(icon, cap, fn, dis){
    var b = document.createElement("button");
    b.className = "sec"; b.disabled = !!dis;
    b.innerHTML = '<span class="ic">'+icon+'</span><span class="cap">'+cap+'</span>';
    b.addEventListener("click", fn); L.appendChild(b); return b;
  }

  if(isSM){
    if(browsing) sec("&#9679;", "Live", function(){ browsing=false; viewIdx=S.liveIndex; render(); });
    else sec("&#9664;", "Back", function(){ callScene(S.liveIndex-1); }, S.liveIndex<=0);

    var go = document.createElement("button");
    go.className = "go"; go.disabled = !next || calling;
    if(calling){
      go.innerHTML = '<span class="k">Sending to every device</span><span class="v">Calling…</span>';
      R.appendChild(go); J.classList.add("hide"); syncChip(); return;
    }
    go.innerHTML = '<span class="k">' + (next ? "Call next scene" : "End of show") + '</span>'
      + '<span class="v">' + (next ? '<span class="num">'+(S.liveIndex+2)+'</span>'+esc(next.name)
                                   : '<span class="num">'+(S.liveIndex+1)+'</span>'+esc(live?live.name:"—")) + '</span>';
    go.addEventListener("click", function(){ callScene(S.liveIndex+1); });
    R.appendChild(go);

    if(browsing && viewIdx !== S.liveIndex){
      J.classList.remove("hide");
      J.innerHTML = "";
      var t = document.createElement("span"); t.className = "t";
      t.textContent = "Looking at " + (viewIdx+1) + ". " + (sceneAt(viewIdx)||{}).name;
      var jb = document.createElement("button"); jb.className = "btn go-small";
      jb.textContent = "Jump the show here";
      jb.addEventListener("click", function(){ callScene(viewIdx); });
      J.appendChild(t); J.appendChild(jb);
    } else J.classList.add("hide");
  } else {
    sec("&#9664;", "Back", function(){
      viewIdx = Math.max(0, viewIdx-1); browsing = viewIdx !== S.liveIndex; render();
    }, viewIdx<=0);
    sec("&#9654;", "Ahead", function(){
      viewIdx = Math.min(S.scenes.length-1, viewIdx+1); browsing = viewIdx !== S.liveIndex; render();
    }, viewIdx>=S.scenes.length-1);


    if(browsing){
      J.classList.remove("hide"); J.innerHTML = "";
      var t2 = document.createElement("span"); t2.className = "t";
      t2.textContent = "The show is on " + (S.liveIndex+1) + ". " + (live?live.name:"—");
      var bb = document.createElement("button"); bb.className = "btn go-small";
      bb.textContent = "Back to live";
      bb.addEventListener("click", function(){ browsing=false; viewIdx=S.liveIndex; render(); });
      J.appendChild(t2); J.appendChild(bb);
    } else J.classList.add("hide");
  }
  syncChip();
}

function paintHeader(){
  $("showname").textContent = S.show;
  var isSM = role === "sm";
  if(!isSM) editing = false;
  $("btn-role").textContent = isSM ? "Stage manager" : "Crew";
  var pm = $("plan-mode");
  pm.textContent = editing ? "Editing" : (browsing ? "Looking ahead" : "Live");
  pm.className = "mode " + (editing ? "edit" : (browsing ? "ahead" : "live"));
  var be = $("btn-edit");
  be.classList.toggle("hide", !isSM);
  be.textContent = editing ? (dirty ? "Save" : "Done") : "Edit";
  be.classList.toggle("on", editing);
  document.body.classList.toggle("editing", editing);
  $("btn-mapedit").classList.toggle("hide", !isSM || editing);
  $("btn-routes").textContent = showRoutes ? "Routes on" : "Routes off";
  $("btn-dim").textContent = DIMS[dimIdx].label;
  $("btn-wake").textContent = !wakeOk ? "No screen lock" : (wakeWanted ? "Screen stays on" : "Screen sleeps");
  $("btn-wake").disabled = !wakeOk;
}

/* A call that did not reach the other devices must not be a toast that
   fades. It stays until the SM retries or accepts it. */
function paintAlert(){
  var a = $("alert");
  if(callFail === null){ a.classList.add("hide"); a.innerHTML = ""; return; }
  a.classList.remove("hide"); a.innerHTML = "";
  var m = document.createElement("div"); m.className = "msg";
  var sc = sceneAt(callFail);
  m.textContent = "Not sent — the crew is still on the scene before this one. "
    + "You are on " + (callFail+1) + ". " + (sc ? sc.name : "") + "; their phones are not.";
  var retry = document.createElement("button");
  retry.textContent = "Send again";
  retry.addEventListener("click", async function(){
    retry.disabled = true; retry.textContent = "Sending…";
    S.liveStamp = Date.now();
    var ok = await publish();
    if(ok) callFail = null;
    render();
  });
  var dismiss = document.createElement("button");
  dismiss.textContent = "Call it by headset";
  dismiss.addEventListener("click", function(){ callFail = null; render(); });
  a.appendChild(m); a.appendChild(retry); a.appendChild(dismiss);
}

/* Crew stand on one side. Let them cut the list to their own traffic. */
function moveMatches(m){
  if(mvFilter === "all" || m.kind === "curtain") return true;
  var want = mvFilter === "sr" ? "R" : "L";
  var sides = [];
  if(m.from) sides.push(SIDE[m.from.zone]);
  if(m.to)   sides.push(SIDE[m.to.zone]);
  if(sides.indexOf(want) >= 0) return true;
  return sides.length > 0 && sides.every(function(s){ return s === "C"; });
}
function paintFilter(){
  var box = $("mvfilter"); box.innerHTML = "";
  [["all","All"],["sr","SR side"],["sl","SL side"]].forEach(function(o){
    var b = document.createElement("button");
    b.textContent = o[1];
    if(mvFilter === o[0]) b.className = "on";
    b.addEventListener("click", function(){
      mvFilter = o[0]; LS.set("mvfilter", mvFilter); render();
    });
    box.appendChild(b);
  });
}

function paintRail(){
  var rail = $("strip"); rail.innerHTML = "";
  S.scenes.forEach(function(sc, i){

    var n = document.createElement("div"); n.className = "n";

    b.appendChild(n); b.appendChild(t);

}

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

function paintMoves(allMoves){
  var box = $("moves"); box.innerHTML = "";
  var moves = allMoves.filter(moveMatches);
  $("mvcount").textContent = moves.length + (moves.length !== allMoves.length ? " / " + allMoves.length : "");
  if(!moves.length){
    var msg;
    if(allMoves.length) msg = "Nothing on this side. " + allMoves.length + " move"
      + (allMoves.length>1?"s":"") + " on the other side — switch the filter to All to see them.";
    else if(viewIdx === 0) msg = "Scene 1 is the preset. This is where every piece starts before the house opens.";
    else msg = "Nothing moves into this scene. The stage stays exactly as it is.";
    box.innerHTML = '<div class="empty">' + esc(msg) + '</div>';
    return;
  }
  moves.forEach(function(m){
    var d = document.createElement("button"); d.className = "mv";
    var sw = document.createElement("div"); sw.className = "sw";
    var tx = document.createElement("div"); tx.className = "txt";
    if(m.kind === "curtain"){
      sw.style.background = "var(--gel-rose)";
      tx.innerHTML = '<div class="nm"><span class="verb">Curtain</span>' + esc(m.text) + '</div>'
                   + '<div class="path">' + esc(m.sub) + '</div>';
      d.appendChild(sw); d.appendChild(tx); box.appendChild(d); return;
    }
    sw.style.background = m.piece.color;
    var verb = { on:"Bring on", off:"Strike", shift:"Reposition", trav:"Move" }[m.kind];
    var nm = document.createElement("div"); nm.className = "nm";
    nm.innerHTML = '<span class="verb">'+verb+'</span>' + esc(m.piece.name);
    var path = document.createElement("div"); path.className = "path";
    function z(text, cls){ var s=document.createElement("span"); s.className="z"+(cls?" "+cls:""); s.textContent=text; return s; }
    function arrow(){ var s=document.createElement("span"); s.className="ar"; s.textContent="→"; return s; }
    if(m.from) path.appendChild(z(zoneLabel(m.from)));
    if(m.r && m.r.via.length) m.r.via.forEach(function(v){ path.appendChild(arrow()); path.appendChild(z(v,"via")); });
    if(m.from) path.appendChild(arrow());
    path.appendChild(z(m.to ? zoneLabel(m.to) : "Out of play"));
    tx.appendChild(nm); tx.appendChild(path);
    if(m.to && m.to.note){ var hn=document.createElement("div"); hn.className="hint"; hn.textContent=m.to.note; tx.appendChild(hn); }
    d.appendChild(sw); d.appendChild(tx);
    d.addEventListener("click", function(){ selected = m.piece.id; render(); });
    box.appendChild(d);
  });
}

  body.appendChild(rp);
  var ph3 = document.createElement("div"); ph3.className = "help"; ph3.style.marginTop="6px";
  ph3.textContent = "The run sheet prints every scene and its moves in order — worth having on the callboard when the wifi drops.";
  body.appendChild(ph3);
}
function moveScene(dir){
  var j = viewIdx + dir;
  if(j<0 || j>=S.scenes.length) return;
  var liveSc = S.scenes[S.liveIndex];
  var liveId = liveSc ? liveSc.id : null;
  var tmp = S.scenes[viewIdx]; S.scenes[viewIdx] = S.scenes[j]; S.scenes[j] = tmp;
  viewIdx = j;
  for(var k=0;k<S.scenes.length;k++) if(S.scenes[k].id===liveId) S.liveIndex = k;
  browsing = viewIdx !== S.liveIndex;
  markDirty(); render();
}

/* ---------- run sheet (paper backup) ---------- */
function buildSheet(){
  var el = $("runsheet"); el.innerHTML = "";   // never $("sheet") — that is the stylesheet
  var h = document.createElement("h1"); h.className = "big"; h.textContent = S.show;
  var meta = document.createElement("div"); meta.className = "meta";
  meta.textContent = "Set change run sheet · " + S.scenes.length + " scenes · "
    + S.pieces.length + " pieces · printed " + new Date().toLocaleDateString();
  el.appendChild(h); el.appendChild(meta);

  S.scenes.forEach(function(sc, i){
    var blk = document.createElement("div"); blk.className = "blk";
    var hd = document.createElement("div"); hd.className = "hd2";
    var no = document.createElement("span"); no.className = "no big"; no.textContent = (i+1) + ".";
    var nm = document.createElement("span"); nm.className = "nmx"; nm.textContent = sc.name;
    var cu = document.createElement("span"); cu.className = "cur";
    cu.textContent = sc.curtain === "closed" ? "curtain in" : "curtain out";
    hd.appendChild(no); hd.appendChild(nm); hd.appendChild(cu);
    blk.appendChild(hd);
    if(sc.note){ var nt = document.createElement("div"); nt.className = "nt"; nt.textContent = sc.note; blk.appendChild(nt); }

    var moves = movesBetween(sceneAt(i-1), sc);
    if(!moves.length){
      var none = document.createElement("div"); none.className = "none";
      none.textContent = i === 0 ? "Preset — see placements below." : "No change.";
      blk.appendChild(none);
    } else {
      var ol = document.createElement("ol");
      moves.forEach(function(m){
        var li = document.createElement("li");
        if(m.kind === "curtain"){ li.textContent = m.text + " — " + m.sub; ol.appendChild(li); return; }
        var verb = { on:"Bring on", off:"Strike", shift:"Reposition", trav:"Move" }[m.kind];
        var path = (m.from ? zoneLabel(m.from) : "off");
        if(m.r && m.r.via.length) path += " → " + m.r.via.join(" → ");
        path += " → " + (m.to ? zoneLabel(m.to) : "out of play");
        li.textContent = verb + " " + m.piece.name + ": " + path + (m.to && m.to.note ? "  (" + m.to.note + ")" : "");
        ol.appendChild(li);
      });
      blk.appendChild(ol);
    }
    if(i === 0){
      var ol2 = document.createElement("ol");
      S.pieces.forEach(function(p){
        var pl = sc.place[p.id]; if(!pl) return;
        var li = document.createElement("li");
        li.textContent = p.name + ": " + zoneLabel(pl) + (pl.note ? "  (" + pl.note + ")" : "");
        ol2.appendChild(li);
      });
      if(ol2.children.length) blk.appendChild(ol2);
    }
    el.appendChild(blk);
  });
}

/* ---------- modals ---------- */
function confirmAsk(title, body, onYes, yesLabel, noLabel){
  var scrim = document.createElement("div"); scrim.className = "scrim";
  var m = document.createElement("div"); m.className = "modal";
  var h = document.createElement("h3"); h.textContent = title;
  var p = document.createElement("div"); p.className = "help"; p.textContent = body;
  var r = document.createElement("div"); r.className = "row"; r.style.marginTop = "16px";
  var no = mkbtn(noLabel || "Keep it", "btn", function(){ scrim.remove(); });
  var yes = mkbtn(yesLabel || "Delete", "btn hot", function(){ scrim.remove(); onYes(); });
  r.appendChild(no); r.appendChild(yes);
  m.appendChild(h); m.appendChild(p); m.appendChild(r);
  scrim.appendChild(m); document.body.appendChild(scrim);
  no.focus();
}
function askRole(force){
  if(role && !force) return;
  var scrim = document.createElement("div"); scrim.className = "scrim";
  var m = document.createElement("div"); m.className = "modal";
  var h = document.createElement("h3"); h.textContent = "Who is on this device?";
  var p = document.createElement("div"); p.className = "help";
  p.textContent = "The stage manager and director build the show and call the scenes. Everyone else follows along.";
  m.appendChild(h); m.appendChild(p);
  var pick = document.createElement("div"); pick.className = "pick";
  function opt(title, sub, val){
    var b = document.createElement("button");
    var t = document.createElement("b"); t.textContent = title;
    var s = document.createElement("span"); s.textContent = sub;
    b.appendChild(t); b.appendChild(s);
    b.addEventListener("click", function(){
      role = val; LS.set("role", role);
      if(role !== "sm") editing = false;
      scrim.remove(); render();
    });
    pick.appendChild(b);
  }
  opt("Stage manager or director", "Build scenes, place pieces, call the show.", "sm");
  opt("Crew", "Follow the called scene and see what moves where.", "crew");
  m.appendChild(pick);
  if(force){
    var r = document.createElement("div"); r.className="row"; r.style.marginTop="14px";
    r.appendChild(mkbtn("Cancel", "btn", function(){ scrim.remove(); }));
    m.appendChild(r);
  }
  scrim.appendChild(m); document.body.appendChild(scrim);
}

/* ---------- master render ---------- */
function render(){
  var sc = sceneAt(viewIdx), prev = sceneAt(viewIdx-1);
  var moves = movesBetween(prev, sc);
  paintHeader();
  paintAlert();
  paintDemoBar();
  paintSceneHead();
  paintDeck();
  paintRail();
  paintFilter();
  drawPieces(sc);
  drawRoutes(moves);
  setCurtain(sc ? sc.curtain === "open" : true, false);
  paintMoves(moves);
  paintNotes();
  paintInspector();
  paintEditor();
}
function replay(){
  var sc = sceneAt(viewIdx), prev = sceneAt(viewIdx-1);
  if(!prev){ toast("This is the first scene — nothing moves into it."); return; }
  animateTransition(prev, sc);
}

  if(!nowHidden) paintEditor();
});
document.addEventListener("keydown", function(e){
  if(e.target && /input|textarea/i.test(e.target.tagName)) return;
  if(role!=="sm" || browsing) return;
  if(e.key==="ArrowRight" || e.key===" ") { e.preventDefault(); callScene(S.liveIndex+1); }
  if(e.key==="ArrowLeft") callScene(S.liveIndex-1);
});

if(S.demo === undefined) S.demo = (S.show === "Spring Production");
render();
applyMap();
applyDim();
if(wakeWanted) applyWake();
askRole(false);

if(S.liveStamp && S.liveStamp !== lastSeen){
  LS.set("lastSeen", S.liveStamp);
  if(S.liveIndex === viewIdx) setTimeout(replay, 140);
}

(async function(){
  try{
    var cap = await (window.claude && window.claude.use ? window.claude.use("artifact") : Promise.resolve(null));
    if(cap){ api = cap; apiState = "live"; } else { apiState = "local"; }
  }catch(e){ apiState = "local"; }
  syncChip();
})();
})();
</script>
</body>
