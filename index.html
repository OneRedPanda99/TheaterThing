/* ===== src/parts/10-model.js ===== */
/* ===============================================================
   The model: where the theatre is, how a piece gets from one part
   of it to another, and what changed between two scenes.

   Nothing here touches the DOM. The move list is *derived*, never
   typed, so it can never drift out of sync with the ground plan.
   =============================================================== */

var VB = { w:1170, h:658 };
/* `short` is what the map prints inside the zone; `name` is what the
   move list says. The map has 150 units of width to work with and the
   list has a whole line. */
var ZONES = {
  aux:    { x:20,  y:132, w:150, h:268, kind:"aux",   name:"Aux stage", short:"AUX", sub:"stage right" },
  wingSR: { x:190, y:80,  w:160, h:462, kind:"wing",  name:"Wing SR",   short:"WING SR" },
  stage:  { x:370, y:80,  w:600, h:462, kind:"stage", name:"Stage",     short:"STAGE" },
  wingSL: { x:990, y:80,  w:160, h:462, kind:"wing",  name:"Wing SL",   short:"WING SL" }
};
var ORDER = { aux:0, wingSR:1, stage:2, wingSL:3 };
var SIDE  = { aux:"R", wingSR:"R", stage:"C", wingSL:"L" };
var CROSS_Y = 50, CURTAIN_Y = 542;

/* ---------------- the line sets ----------------
   Three of them, called by name. Open always means the audience can
   see the stage; closed means they cannot. The main curtain hangs at
   the proscenium, the mid curtain splits the stage for a shallow
   scene, and the scrim sits upstage of both.

   The main one is stored as `curtain` because that is what shows built
   before the other two called it, and renaming it would strand them. */
var CURTAINS = [
  { key:"curtain", name:"Main curtain", short:"MAIN",  cls:"main",  color:"var(--gel-rose)" },
  { key:"mid",     name:"Mid curtain",  short:"MID",   cls:"mid",   color:"var(--gel-congo)", ft:16 },
  /* cls is "sheer", not "scrim": .scrim is the modal backdrop, and a
     curtain sharing it means querySelector(".scrim") finds a rect on
     the plan — which the Escape handler then deletes. */
  { key:"scrim",   name:"Scrim",        short:"SCRIM", cls:"sheer", color:"var(--gel-green)", ft:8 }
];
/* Where a line set hangs, in plan units. The main curtain is at the
   proscenium by definition. The other two are measured downstage from
   the back wall in feet, so they stay where they really hang if the
   stage is rescaled — the drawing keeps its shape, so a foot of depth
   scales with a foot of width. */
function curtainY(c){
  return c.ft === undefined ? CURTAIN_Y : ZONES.stage.y + toUnits(c.ft);
}
/* Anything not explicitly closed is open — a theatre with no mid
   curtain simply never closes one, and nothing is ever called for it. */
function curtainAt(sc, key){ return (sc && sc[key] === "closed") ? "closed" : "open"; }
function curtainSummary(sc){
  var shut = CURTAINS.filter(function(c){ return curtainAt(sc, c.key) === "closed"; });
  if(!shut.length) return "Everything open";
  if(shut.length === CURTAINS.length) return "Everything closed";
  var names = shut.map(function(c){ return c.short.toLowerCase(); });
  var last = names.pop();
  var text = (names.length ? names.join(", ") + " and " + last : last) + " closed";
  return text.charAt(0).toUpperCase() + text.slice(1);
}
var COLS = ["R","C","L"], ROWS = ["US","MS","DS"];
var PALETTE = ["#C1683B","#4E8C6A","#6D7BC4","#9C5AA8","#B0913F","#3F8AA0","#B8474C","#7E6BB5"];

/* ---------------- feet ----------------
   The plan is drawn in its own units; a crew measures in feet. One
   number ties them together: how wide the stage really is. The stage
   zone is 600 units across, so a foot is 600 / stageFeet units, and
   every piece can be typed and read back in feet and inches.

   It lives on the show because it is a fact about one theatre. Change
   it and nothing on the plan moves — the same drawing is simply being
   measured against a different stage. */
var STAGE_FT_DEFAULT = 40;
var MIN_FT = 0.5, MAX_FT = 40;

function stageFeet(){ return (S.stageFeet > 0) ? S.stageFeet : STAGE_FT_DEFAULT; }
function unitsPerFoot(){ return ZONES.stage.w / stageFeet(); }
function toFeet(u){ return u / unitsPerFoot(); }
function toUnits(ft){ return ft * unitsPerFoot(); }
function clampSz(u){
  return Math.round(Math.max(toUnits(MIN_FT), Math.min(toUnits(MAX_FT), u)));
}

/* Read what a person actually types. A bare number is feet, because
   that is how set pieces get talked about: "the sofa is about seven
   foot". Also takes 8', 8'6, 8'6", 8 ft 6 in, 18", 8.5. */
function parseFeet(raw){
  var s = String(raw == null ? "" : raw).trim().toLowerCase();
  if(!s) return null;
  s = s.replace(/[′´`]/g, "'").replace(/[″”“]/g, '"');
  var ft = 0, inch = 0, sawFeet = false, sawInch = false, m;

  m = s.match(/([\d.]+)\s*(?:'|ft\b|feet\b|foot\b)/);
  if(m){ ft = parseFloat(m[1]); sawFeet = true; s = s.slice(m.index + m[0].length); }

  m = s.match(/([\d.]+)\s*(?:"|in\b|ins\b|inch|inches)/);
  if(m){ inch = parseFloat(m[1]); sawInch = true; }
  else if(sawFeet){
    m = s.match(/([\d.]+)/);            // trailing bare number after feet is inches: 8'6
    if(m) inch = parseFloat(m[1]);
  }

  if(!sawFeet && !sawInch){
    m = s.match(/([\d.]+)/);
    if(!m) return null;
    ft = parseFloat(m[1]);
  }
  var v = ft + inch/12;
  return isFinite(v) ? v : null;
}
function fmtFeet(ft){
  var total = Math.round(ft * 12);
  var f = Math.floor(total / 12), i = total % 12;
  if(!f) return i + '"';
  return i ? f + "' " + i + '"' : f + "'";
}

/* An angle you can read. Rotation is free, so it is rarely round. */
function normAngle(r){ r = Math.round(r) % 360; return r < 0 ? r + 360 : r; }

function zoneOf(id){ return ZONES[id]; }
function abs(pl){ var z = zoneOf(pl.zone); if(!z) return null; return { x:z.x+pl.x*z.w, y:z.y+pl.y*z.h }; }
function ctr(zid, fy){ var z = ZONES[zid]; return { x:z.x+z.w/2, y:z.y+z.h*(fy===undefined?0.5:fy) }; }

function cellName(pl){
  var c = pl.x<0.34?0:(pl.x<0.67?1:2), r = pl.y<0.34?0:(pl.y<0.67?1:2);
  return ROWS[r] + COLS[c];
}
function zoneLabel(pl){
  if(!pl) return "Not in play";
  if(pl.zone === "stage") return "Stage " + cellName(pl);
  return zoneOf(pl.zone) ? zoneOf(pl.zone).name : pl.zone;
}

/* Routes are physical. Wing SR to wing SL goes around the upstage
   crossover, never across the stage; anything to or from the aux
   stage passes through wing SR, because that is the only door. */
function route(from, to){
  var a = abs(from), b = abs(to);
  if(!a || !b) return { pts:[], via:[] };
  var f = from.zone, t = to.zone;
  if(f === t) return { pts:[a,b], via:[] };
  var pts = [a], via = [];
  if(SIDE[f] !== "C" && SIDE[t] !== "C" && SIDE[f] !== SIDE[t]){
    if(f === "aux"){ pts.push(ctr("wingSR", 0.35)); via.push("Wing SR"); }
    pts.push({ x: ctr(f === "aux" ? "wingSR" : f).x, y: CROSS_Y });
    pts.push({ x: ctr(t === "aux" ? "wingSR" : t).x, y: CROSS_Y });
    via.push("Crossover");
    if(t === "aux"){ pts.push(ctr("wingSR", 0.35)); via.push("Wing SR"); }
  } else {
    var fi = ORDER[f], ti = ORDER[t], stepDir = ti > fi ? 1 : -1;
    for(var i = fi + stepDir; i !== ti; i += stepDir){
      var zid = Object.keys(ORDER).filter(function(k){ return ORDER[k] === i; })[0];
      if(zid){ pts.push(ctr(zid, 0.5)); via.push(ZONES[zid].name); }
    }
  }
  pts.push(b);
  return { pts:pts, via:via };
}

/* A nudge of less than 5% of a zone is not a move worth calling. */
var MOVE_EPS = 0.05;
var VERB = { on:"Bring on", off:"Strike", shift:"Reposition", trav:"Move", turn:"Turn" };
/* A piece that only pivots is its own kind of move. Called as a
   reposition it reads "Stage USC to Stage USC", which tells the crew
   nothing about what to actually go and do. */
function turnText(a, b){
  return normAngle((a && a.r) || 0) + "° → " + normAngle((b && b.r) || 0) + "°";
}

function movesBetween(prev, next){
  if(!next || !prev) return [];
  var out = [];
  CURTAINS.forEach(function(c){
    var was = curtainAt(prev, c.key), now = curtainAt(next, c.key);
    if(was === now) return;
    out.push({ kind:"curtain", cur:c,
               verb: now === "open" ? "Open" : "Close",
               text: c.name,
               sub:  now === "open" ? "before the scene starts" : "on the end of the scene" });
  });
  var seen = {};
  Object.keys(next.place).concat(Object.keys(prev.place)).forEach(function(id){
    if(seen[id]) return; seen[id] = 1;
    var p = pieceById(id); if(!p) return;
    var a = prev.place[id] || null, b = next.place[id] || null;
    if(!a && !b) return;
    if(!b){ out.push({ kind:"off", piece:p, from:a, to:null }); return; }
    if(!a){ out.push({ kind:"on", piece:p, from:null, to:b }); return; }
    var turned = (a.r||0) !== (b.r||0);
    if(a.zone !== b.zone){
      out.push({ kind:"trav", piece:p, from:a, to:b, r:route(a,b), turned:turned }); return;
    }
    var slid = Math.abs(a.x-b.x) > MOVE_EPS || Math.abs(a.y-b.y) > MOVE_EPS;
    if(slid || turned){
      out.push({ kind: slid ? "shift" : "turn", piece:p, from:a, to:b,
                 r:route(a,b), turned:turned });
    }
  });
  var rank = { curtain:0, trav:1, on:2, shift:3, turn:4, off:5 };
  out.sort(function(m,n){ return rank[m.kind] - rank[n.kind]; });
  return out;
}
function movesInto(i){ return movesBetween(sceneAt(i-1), sceneAt(i)); }

/* ===== src/parts/20-plan.js ===== */
/* ===============================================================
   The ground plan.

   Drawn from the house, so stage right sits on the left the way a
   real ground plan reads. The map is always on screen — it is the
   thing the app is for — and it owns its own pinch, pan and drag.

   Everything a thumb or an eye has to find is sized through
   planScale(), which converts plan units to CSS pixels at the
   current zoom. That way a label is the same physical size on a
   phone as on an iPad, at any zoom, with no width media queries.
   =============================================================== */

var svgNS = "http://www.w3.org/2000/svg";
var plansvg = $("plansvg");
var svg = null, pieceLayer = null, routeLayer = null;
var curtains = {};          // curtain key -> { L, R } panel pair
var labels = [];            // { node, px, y, em } — see label() / sizeLabels()
var nodes = {};             // piece id -> <g>

function el(tag, attrs, parent){
  var n = document.createElementNS(svgNS, tag);
  for(var k in attrs) n.setAttribute(k, attrs[k]);
  if(parent) parent.appendChild(n);
  return n;
}
/* Register a label so its size follows the zoom. Type in an SVG is in
   user units, so a fixed font-size is a different physical size at
   every zoom and on every screen; px is the size it should read at,
   in CSS pixels, and sizeLabels converts.

   em offsets a second line below a first: line spacing has to scale
   with the type, and a fixed y gap that looks right at fit zoom has
   the two lines overlapping the moment you zoom in. */
function label(node, px, em){
  labels.push({ node:node, px:px, y:parseFloat(node.getAttribute("y")) || 0, em:em || 0 });
  return node;
}

function buildPlan(){
  plansvg.innerHTML = ""; labels = [];
  svg = el("svg", { viewBox:"0 0 "+VB.w+" "+VB.h, class:"plan", "aria-label":"Stage ground plan" });
  plansvg.appendChild(svg);

  el("rect", { x:190, y:26, width:960, height:48, rx:14, fill:"none",
               stroke:"var(--rule2)", "stroke-dasharray":"3 7" }, svg);
  label(el("text", { x:670, y:56, "text-anchor":"middle", class:"zone-name" }, svg), 11)
    .textContent = "Upstage crossover";

  /* Zone names sit inside their zone, top left. Set above the zone, at
     a size big enough to read on a phone, the outermost two ran off the
     edge of the viewBox and were clipped. */
  Object.keys(ZONES).forEach(function(zid){
    var z = ZONES[zid];
    el("rect", { x:z.x, y:z.y, width:z.w, height:z.h, rx:16, class:"zone-fill-"+z.kind }, svg);
    el("rect", { x:z.x, y:z.y, width:z.w, height:z.h, rx:16, class:"zone-edge "+z.kind }, svg);
    label(el("text", { x:z.x+10, y:z.y+20, class:"zone-name" }, svg), 11)
      .textContent = z.short;
    if(z.sub){
      label(el("text", { x:z.x+10, y:z.y+20, class:"plan-note" }, svg), 9, 1.2)
        .textContent = z.sub;
    }
  });

  /* The stage carries a 3x3 grid (USR through DSL) so "where on
     stage" is an actual spot rather than a vague gesture. */
  var st = ZONES.stage;
  [1,2].forEach(function(i){
    el("line", { x1:st.x+st.w*i/3, y1:st.y, x2:st.x+st.w*i/3, y2:st.y+st.h, class:"grid-line" }, svg);
    el("line", { x1:st.x, y1:st.y+st.h*i/3, x2:st.x+st.w, y2:st.y+st.h*i/3, class:"grid-line" }, svg);
  });
  for(var r=0;r<3;r++) for(var c=0;c<3;c++){
    label(el("text", { x:st.x+st.w*(c/3)+8, y:st.y+st.h*((r+1)/3)-8, class:"grid-tag" }, svg), 9)
      .textContent = ROWS[r] + COLS[c];
  }
  /* Each wing is marked with leg positions, so "where in the wing"
     is a spot too. */
  ["wingSR","wingSL"].forEach(function(zid){
    var z = ZONES[zid];
    [1,2,3].forEach(function(i){
      el("line", { x1:z.x+6, y1:z.y+z.h*i/4, x2:z.x+z.w-6, y2:z.y+z.h*i/4, class:"grid-line" }, svg);
      label(el("text", { x:z.x+6, y:z.y+z.h*i/4+13, class:"grid-tag" }, svg), 9)
        .textContent = "leg " + i;
    });
  });

  routeLayer = el("g", {}, svg);
  pieceLayer = el("g", {}, svg);

  /* All three line sets, each on its own rod, each named at the stage
     left end so the crew can tell which one is being called. */
  curtains = {};
  CURTAINS.forEach(function(c){
    var y = curtainY(c);
    el("line", { x1:st.x-8, y1:y, x2:st.x+st.w+8, y2:y, class:"curtain-rod" }, svg);
    curtains[c.key] = {
      L: el("rect", { x:st.x, y:y-5, width:st.w/2, height:10,
                      class:"curtain " + c.cls }, svg),
      R: el("rect", { x:st.x+st.w/2, y:y-5, width:st.w/2, height:10,
                      class:"curtain " + c.cls }, svg)
    };
    label(el("text", { x:st.x+st.w-8, y:y-7, "text-anchor":"end", class:"grid-tag" }, svg), 9)
      .textContent = c.short;
  });

  el("rect", { x:st.x, y:CURTAIN_Y+26, width:st.w, height:62, rx:14, class:"house" }, svg);
  label(el("text", { x:st.x+st.w/2, y:CURTAIN_Y+61, "text-anchor":"middle", class:"house-tag" }, svg), 11)
    .textContent = "AUDIENCE";
  label(el("text", { x:st.x+st.w/2, y:CURTAIN_Y+61, "text-anchor":"middle", class:"plan-note" }, svg), 10, 1.5)
    .textContent = "drawn from the house — stage right is on your left";

  svg.addEventListener("pointerdown", onPointerDown);
  svg.addEventListener("pointermove", onPointerMove);
  svg.addEventListener("pointerup", onPointerUp);
  svg.addEventListener("pointercancel", onPointerUp);
  svg.addEventListener("wheel", onWheel, { passive:false });
  svg.addEventListener("dblclick", function(){ fitView(); });
  applyView();
}

function setCurtains(scene, animate){
  var st = ZONES.stage, half = st.w/2;
  CURTAINS.forEach(function(c){
    var pair = curtains[c.key]; if(!pair) return;
    var w = curtainAt(scene, c.key) === "open" ? half*0.12 : half;
    pair.L.style.transition = animate ? "width .55s ease" : "none";
    pair.R.style.transition = animate ? "width .55s ease, x .55s ease" : "none";
    pair.L.setAttribute("width", w);
    pair.R.setAttribute("width", w);
    pair.R.setAttribute("x", st.x + st.w - w);
  });
}

/* Plan units per CSS pixel at the current zoom. */
function planScale(){
  var px = plansvg.clientWidth || 0;
  var w = (view && view.w) ? view.w : VB.w;
  return px > 0 ? w / px : 1.4;
}
function sizeLabels(){
  var k = planScale();
  for(var i=0;i<labels.length;i++){
    var L = labels[i], fs = L.px * k;
    L.node.setAttribute("font-size", fs);
    if(L.em) L.node.setAttribute("y", L.y + L.em * fs);
  }
}

/* A piece is drawn at its true footprint and then turned, rather than
   having its width and height swapped. Swapping only ever expressed
   two angles; a flat pointing upstage at 30 degrees is a real thing a
   set does. */
function xform(x, y, r){
  return "translate(" + x + "," + y + ")" + (r ? " rotate(" + r + ")" : "");
}
/* The upright box a turned rectangle sits inside: the caption has to
   clear its bottom, the menu handle has to clear its side. */
function spanH(w, h, r){
  var a = r * Math.PI / 180;
  return Math.abs(w * Math.sin(a)) + Math.abs(h * Math.cos(a));
}
function spanW(w, h, r){
  var a = r * Math.PI / 180;
  return Math.abs(w * Math.cos(a)) + Math.abs(h * Math.sin(a));
}
/* The caption stays upright while the piece turns, so a name is never
   read sideways. Counter-rotating inside the turned group cancels the
   turn for the text without moving the piece. */
function setPieceTransform(g, x, y, r, w, h, capFS){
  g.setAttribute("transform", xform(x, y, r));
  var spin = g.querySelector(".upright");
  if(!spin) return;
  spin.setAttribute("transform", "rotate(" + (-r) + ")");
  var t = spin.querySelector(".cap");
  if(t) t.setAttribute("y", spanH(w, h, r)/2 + 4 + capFS);
  var mg = spin.querySelector(".menu");
  if(mg) mg.setAttribute("transform",
    "translate(" + (spanW(w, h, r)/2 + (parseFloat(g.getAttribute("data-arm")) || 0)) + ",0)");
}

var SPIN_ARM = 22;          // handle stand-off from the piece, in CSS px
function drawPieces(scene){
  if(!pieceLayer) return;
  pieceLayer.innerHTML = ""; nodes = {};
  if(!scene) return;
  var k = planScale();
  var capFS = Math.max(9, 11.5 * k);
  /* Captioning all eight pieces at fit zoom turns two chairs a foot
     apart into a smear of overlapping type. During a run the only
     names worth printing on the map are the ones that move into this
     scene, plus whatever is selected; everything else is a coloured
     block whose name is in the list. Build mode captions the lot,
     because there you are looking for a specific piece. */
  var named = null;
  if(mode !== "build"){
    named = {};
    if(selected) named[selected] = 1;
    movesInto(viewIdx).forEach(function(m){ if(m.piece) named[m.piece.id] = 1; });
  }
  S.pieces.forEach(function(p){
    var pl = scene.place[p.id];
    if(!pl) return;
    var a = abs(pl); if(!a) return;
    var rot = pl.r || 0;
    var w = p.w, hh = p.h;
    var g = el("g", { class:"pc" + (selected===p.id ? " sel" : ""), "data-id":p.id,
                      transform:xform(a.x, a.y, rot) }, pieceLayer);
    var rx = Math.min(9, Math.min(w, hh) / 4);
    el("rect", { x:-w/2-5, y:-hh/2-5, width:w+10, height:hh+10, rx:rx+4, class:"halo" }, g);
    el("rect", { x:-w/2, y:-hh/2, width:w, height:hh, rx:rx, class:"body",
                 fill:p.color, stroke:"rgba(0,0,0,.4)" }, g);
    if(pl.note) el("circle", { cx:w/2-6, cy:-hh/2+6, r:Math.max(3, 3.5*k), class:"note-dot" }, g);

    var up = el("g", { class:"upright", transform:"rotate(" + (-rot) + ")" }, g);
    if(!named || named[p.id]){
      var t = el("text", { x:0, y:spanH(w,hh,rot)/2+4+capFS, "text-anchor":"middle",
                           class:"cap", "font-size":capFS, fill:"var(--ink)" }, up);
      t.textContent = p.name;
    }

    /* Two handles on the selected piece, both small and both clear of
       it. The one above turns; it rides with the piece so it points
       the way the piece faces. The one beside opens the menu; it sits
       in the upright group so it never swings underneath your thumb.
       Neither resizes — size is typed, because a resize grip sits
       exactly where a thumb lands while panning. */
    if(mode === "build" && selected === p.id){
      var arm = SPIN_ARM * k, rad = 7 * k;
      g.setAttribute("data-arm", arm);
      var top = -hh/2 - arm;
      el("line", { x1:0, y1:-hh/2, x2:0, y2:top + rad, class:"spin-arm" }, g);
      el("circle", { cx:0, cy:top, r:rad, class:"spin" }, g);
      el("circle", { cx:0, cy:top, r:Math.max(rad*2.4, 22*k), class:"spin-hit",
                     "data-spin":"1" }, g);

      var mg = el("g", { class:"menu",
                         transform:"translate(" + (spanW(w,hh,rot)/2 + arm) + ",0)" }, up);
      el("line", { x1:-arm + rad, y1:0, x2:0, y2:0, class:"spin-arm" }, mg);
      el("circle", { cx:0, cy:0, r:rad*1.25, class:"menu-btn" }, mg);
      [-1,0,1].forEach(function(i){
        el("circle", { cx:i*rad*0.5, cy:0, r:rad*0.16, class:"menu-pip" }, mg);
      });
      el("circle", { cx:0, cy:0, r:Math.max(rad*2.4, 22*k), class:"spin-hit",
                     "data-menu":"1" }, mg);
    }
    nodes[p.id] = g;
  });
}
function drawRoutes(moves){
  if(!routeLayer) return;
  routeLayer.innerHTML = "";
  if(mode === "build") return;              // routes describe a change, not an edit
  moves.forEach(function(m){
    if(!m.r || m.r.pts.length < 2) return;
    var d = m.r.pts.map(function(p,i){ return (i?"L":"M") + p.x + " " + p.y; }).join(" ");
    el("path", { d:d, class:"route" + (selected && selected !== m.piece.id ? " dim" : "") }, routeLayer);
  });
}
function redrawForWidth(){
  var sc = sceneAt(viewIdx);
  sizeLabels();
  drawPieces(sc);
  drawRoutes(movesInto(viewIdx));
}

/* ---------------- animation ---------------- */
var animRAF = null;
function animateTransition(fromScene, toScene){
  if(!toScene) return;
  drawPieces(toScene);
  var moves = movesBetween(fromScene, toScene);
  drawRoutes(moves);
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(!fromScene || reduce){ setCurtains(toScene, false); return; }

  var capFS = Math.max(9, 11.5 * planScale());
  var tracks = [];
  moves.forEach(function(m){
    if(!m.piece || !m.r || m.r.pts.length < 2) return;
    var g = nodes[m.piece.id]; if(!g) return;
    var pts = m.r.pts, segs = [], total = 0;
    for(var i=1;i<pts.length;i++){
      var dx = pts[i].x-pts[i-1].x, dy = pts[i].y-pts[i-1].y, len = Math.sqrt(dx*dx+dy*dy);
      segs.push({ a:pts[i-1], b:pts[i], len:len }); total += len;
    }
    /* Turning counts as moving. A flat that only pivots travels no
       distance, but the crew still has to go and turn it, so it gets a
       track and the plan shows the turn. */
    var r0 = (m.from && m.from.r) || 0, r1 = (m.to && m.to.r) || 0;
    var spin = ((r1 - r0 + 540) % 360) - 180;   // shortest way round
    if(total < 1 && !spin) return;
    tracks.push({ g:g, segs:segs, total:total, r0:r0, spin:spin,
                  w:m.piece.w, h:m.piece.h });
  });
  if(!tracks.length){
    setCurtains(fromScene, false);
    requestAnimationFrame(function(){ setCurtains(toScene, true); });
    return;
  }
  var DUR = 1500, t0 = null;
  if(animRAF) cancelAnimationFrame(animRAF);
  function step(ts){
    if(t0 === null) t0 = ts;
    var k = Math.min(1, (ts-t0)/DUR);
    var e = k < 0.5 ? 2*k*k : 1 - Math.pow(-2*k+2, 2)/2;
    tracks.forEach(function(tr){
      var want = e*tr.total, acc = 0, pos = tr.segs[tr.segs.length-1].b;
      for(var i=0;i<tr.segs.length;i++){
        var s = tr.segs[i];
        if(want <= acc+s.len || i === tr.segs.length-1){
          var f = s.len ? (want-acc)/s.len : 1; f = Math.max(0, Math.min(1, f));
          pos = { x:s.a.x+(s.b.x-s.a.x)*f, y:s.a.y+(s.b.y-s.a.y)*f };
          break;
        }
        acc += s.len;
      }
      setPieceTransform(tr.g, pos.x, pos.y, tr.r0 + tr.spin*e, tr.w, tr.h, capFS);
    });
    if(k < 1) animRAF = requestAnimationFrame(step);
    else { animRAF = null; drawPieces(toScene); drawRoutes(moves); }
  }
  tracks.forEach(function(tr){
    setPieceTransform(tr.g, tr.segs[0].a.x, tr.segs[0].a.y, tr.r0, tr.w, tr.h, capFS);
  });
  setCurtains(fromScene, false);
  requestAnimationFrame(function(){
    setCurtains(toScene, true);
    animRAF = requestAnimationFrame(step);
  });
}
function replay(){
  var sc = sceneAt(viewIdx), prev = sceneAt(viewIdx-1);
  if(!prev){ toast("This is the first scene — nothing moves into it."); return; }
  animateTransition(prev, sc);
}

/* ---------------- zoom and pan ----------------
   The plan fits the screen at rest, which on a phone makes a chair
   about 14px across — fine to read, too small to place. So the map
   zooms: pinch, wheel, or double-tap to fit again. Pan by dragging
   any empty part of the theatre. */
var view = { x:0, y:0, w:VB.w };
var MINZW = VB.w / 9;                        // deepest zoom: about 9x
/* Whether the map is currently showing the whole theatre. It matters
   when the box changes shape — rotating, dragging the sheet, swapping
   screens. Clamping alone keeps the old zoom, which in a box that just
   got wider and shorter means the theatre is suddenly cropped; but
   re-fitting unconditionally would throw away a zoom somebody set on
   purpose. So: if it was fitted, fit it again; if it was not, leave it. */
var fitted = true;

function curAR(){
  var r = svg.getBoundingClientRect();
  return (r.width && r.height) ? r.height / r.width : VB.h / VB.w;
}
/* The width that shows the whole theatre, plus a little air: labels
   sit inside the outermost zones and a dead-tight fit clips them. */
var FIT_PAD = 1.05;
function fitW(){
  var ar = curAR(), w = VB.w;
  if(w * ar < VB.h) w = VB.h / ar;           // box is wider than the plan: fit by height
  return w * FIT_PAD;
}
function axis(v, size, total){               // centre it when it fits, clamp when it does not
  var pad = 40;
  if(size >= total) return (total - size) / 2;
  return Math.max(-pad, Math.min(total - size + pad, v));
}
function applyView(){
  if(!svg) return;
  var top = fitW();
  view.w = Math.max(MINZW, Math.min(top, view.w));
  var h = view.w * curAR();
  view.x = axis(view.x, view.w, VB.w);
  view.y = axis(view.y, h, VB.h);
  svg.setAttribute("viewBox", view.x+" "+view.y+" "+view.w+" "+h);
  var f = $("btn-fit");
  if(f) f.classList.toggle("hide", view.w >= top - 1);
  sizeLabels();
}
function fitView(){ view.w = fitW(); fitted = true; applyView(); redrawForWidth(); }
function refit(){
  if(fitted) fitView();
  else { applyView(); redrawForWidth(); }
}
function zoomAbout(cx, cy, factor){
  var before = view.w;
  var want = Math.max(MINZW, Math.min(fitW(), view.w / factor));
  var k = want / before;
  view.x = cx - (cx - view.x) * k;
  view.y = cy - (cy - view.y) * k;
  view.w = want;
  fitted = want >= fitW() - 1;
  applyView();
  redrawForWidth();
}
function clientToPlan(clientX, clientY){
  var r = svg.getBoundingClientRect();
  if(!r.width || !r.height) return null;
  return { x: view.x + (clientX - r.left) / r.width * view.w,
           y: view.y + (clientY - r.top)  / r.height * (view.w * curAR()) };
}
function svgPoint(evt){
  if(!svg.createSVGPoint || !svg.getScreenCTM) return null;
  var pt = svg.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY;
  var m = svg.getScreenCTM(); if(!m) return null;
  return pt.matrixTransform(m.inverse());
}
function hitZone(p){
  var best = null;
  Object.keys(ZONES).forEach(function(zid){
    var z = ZONES[zid];
    if(p.x >= z.x && p.x <= z.x+z.w && p.y >= z.y && p.y <= z.y+z.h) best = zid;
  });
  return best;
}

/* ---------------- gestures ---------------- */
var pointers = {}, pan = null, pinch = null, drag = null;
function pointerList(){ return Object.keys(pointers); }
function endGestures(){ pan = null; pinch = null; }

function onPointerDown(evt){
  /* A finger that leaves the window, or a touch the browser takes
     back, can skip pointerup and leave a ghost in here forever —
     after which every single-finger drag reads as half a pinch.
     The primary pointer starts a fresh gesture, so anything still
     tracked at that moment is stale. */
  if(evt.isPrimary !== false){ pointers = {}; endGestures(); }
  pointers[evt.pointerId] = { x:evt.clientX, y:evt.clientY };
  var ids = pointerList();

  if(ids.length === 2){                       // a second finger means pinch
    drag = null; pan = null;
    var a = pointers[ids[0]], b = pointers[ids[1]];
    var mid = clientToPlan((a.x+b.x)/2, (a.y+b.y)/2);
    pinch = { d: Math.hypot(a.x-b.x, a.y-b.y), w: view.w, mid: mid };
    if(evt.preventDefault) evt.preventDefault();
    return;
  }
  if(ids.length > 2) return;

  var g = evt.target.closest ? evt.target.closest(".pc") : null;
  if(!g){                                     // empty theatre: drag to pan
    pan = { id:evt.pointerId, x:evt.clientX, y:evt.clientY, vx:view.x, vy:view.y };
    if(mode === "build" && selected){ selected = null; render(); }
    if(svg.setPointerCapture) try{ svg.setPointerCapture(evt.pointerId); }catch(e){}
    return;
  }

  var id = g.getAttribute("data-id");
  var wasSelected = selected === id;
  selected = id;

  if(mode !== "build"){ render(); return; }
  var p = svgPoint(evt);
  if(!p){ render(); return; }

  /* The handles only answer on a piece that is already selected, so
     the tap that picks a piece can never also fire one of them. */
  var hit = wasSelected && evt.target.getAttribute ? evt.target : null;
  if(hit && hit.getAttribute("data-menu") === "1"){
    drag = null;
    render();
    pieceMenu();
    if(evt.preventDefault) evt.preventDefault();
    return;
  }
  var onSpin = !!hit && hit.getAttribute("data-spin") === "1";
  var sc = sceneAt(viewIdx), pl = sc && sc.place[id];
  var c = pl ? abs(pl) : null;
  var pc = pieceById(id);
  /* Both gestures carry the piece's size and angle, because dragging
     rewrites the whole transform every frame and anything left out of
     it is lost for the length of the drag. */
  drag = { id:id, mode: onSpin ? "spin" : "move", c:c,
           r: (pl && pl.r) || 0,
           w: pc ? pc.w : 0, h: pc ? pc.h : 0,
           capFS: Math.max(9, 11.5 * planScale()),
           ox: c ? c.x - p.x : 0, oy: c ? c.y - p.y : 0 };

  if(svg.setPointerCapture) try{ svg.setPointerCapture(evt.pointerId); }catch(e){}
  if(!wasSelected) render();                  // first tap selects and draws the handle
  drag.g = nodes[drag.id] || null;
  if(drag.g) drag.g.classList.add("dragging");
  if(evt.preventDefault) evt.preventDefault();
}

function onPointerMove(evt){
  if(pointers[evt.pointerId]) pointers[evt.pointerId] = { x:evt.clientX, y:evt.clientY };

  if(pinch){
    var ids = pointerList();
    if(ids.length < 2){ pinch = null; return; }
    var a = pointers[ids[0]], b = pointers[ids[1]];
    var d = Math.hypot(a.x-b.x, a.y-b.y);
    if(pinch.d > 0 && pinch.mid){
      var want = Math.max(MINZW, Math.min(fitW(), pinch.w * (pinch.d / d)));
      var k = want / view.w;
      view.x = pinch.mid.x - (pinch.mid.x - view.x) * k;
      view.y = pinch.mid.y - (pinch.mid.y - view.y) * k;
      view.w = want;
      fitted = want >= fitW() - 1;
      applyView();
    }
    if(evt.preventDefault) evt.preventDefault();
    return;
  }

  if(pan){
    var r = svg.getBoundingClientRect();
    if(!r.width) return;
    var per = view.w / r.width;                // plan units per CSS pixel
    view.x = pan.vx - (evt.clientX - pan.x) * per;
    view.y = pan.vy - (evt.clientY - pan.y) * per;
    applyView();
    if(evt.preventDefault) evt.preventDefault();
    return;
  }

  if(!drag || !drag.g) return;
  var p = svgPoint(evt); if(!p) return;
  if(drag.mode === "spin"){
    if(!drag.c) return;
    var sc = sceneAt(viewIdx), pl = sc && sc.place[drag.id];
    if(!pl) return;
    pl.r = angleTo(drag.c, p);
    setPieceTransform(drag.g, drag.c.x, drag.c.y, pl.r, drag.w, drag.h, drag.capFS);
    return;
  }
  setPieceTransform(drag.g, p.x + drag.ox, p.y + drag.oy, drag.r,
                    drag.w, drag.h, drag.capFS);
}

/* The handle stands straight up from the piece, so the angle from the
   piece to the finger is the angle to turn it to.

   It snaps when it is nearly square. Most of a set is built to the
   proscenium, and free rotation that cannot quite reach a clean 90 is
   worse than no free rotation at all — but the snap is only a few
   degrees wide, so a deliberate 37 stays 37. */
var SNAP_EVERY = 15, SNAP_WITHIN = 4;
function angleTo(centre, p){
  var r = Math.atan2(p.y - centre.y, p.x - centre.x) * 180 / Math.PI + 90;
  r = normAngle(r);
  var near = Math.round(r / SNAP_EVERY) * SNAP_EVERY;
  return normAngle(Math.abs(r - near) <= SNAP_WITHIN ? near : r);
}

function onPointerUp(evt){
  delete pointers[evt.pointerId];
  if(pinch && pointerList().length < 2){ pinch = null; redrawForWidth(); }
  if(pan && pan.id === evt.pointerId){ pan = null; redrawForWidth(); return; }
  if(!drag) return;
  if(drag.mode === "spin"){ drag = null; markDirty(); render(); return; }

  var p = svgPoint(evt);
  var sc = sceneAt(viewIdx);
  if(p) p = { x:p.x + drag.ox, y:p.y + drag.oy };   // drop where the piece is, not the finger
  if(p && sc){
    var zid = hitZone(p);
    if(zid){
      var z = ZONES[zid];
      var cur = sc.place[drag.id] || { r:0, note:"" };
      sc.place[drag.id] = {
        zone: zid,
        x: Math.max(0.03, Math.min(0.97, (p.x-z.x)/z.w)),
        y: Math.max(0.03, Math.min(0.97, (p.y-z.y)/z.h)),
        r: cur.r||0, note: cur.note||""
      };
      markDirty();
    } else {
      toast("Dropped outside the theatre — put it on the stage, in a wing, or on the aux stage.");
    }
  }
  drag = null;
  render();
}
function onWheel(evt){
  if(!evt.deltaY) return;
  var pt = clientToPlan(evt.clientX, evt.clientY);
  if(!pt) return;
  if(evt.preventDefault) evt.preventDefault();
  zoomAbout(pt.x, pt.y, evt.deltaY < 0 ? 1.18 : 1/1.18);
}

/* ===== src/parts/30-run.js ===== */
/* ===============================================================
   The run screen — the one everybody stares at during a show.

   One question: what moves, from where, to where, right now. The
   plan answers it in pictures, the sheet answers it in words, and
   the deck moves the show on. Nothing else is on screen.
   =============================================================== */

/* ---------------- the sheet ----------------
   Phone only. Three heights: a peek that shows the scene name, a
   rest position, and a full one that covers the plan. Drag the
   handle, or tap it to step through. Above 640px the sheet is a
   plain pane beside the plan and none of this runs. */
var SNAPS = [0, 1, 2];
var snap = LS.get("snap", 1);
var sheetEl = $("scenesheet"), grabEl = $("grab"), stageEl = $("stage");

function sheetOverlay(){
  return window.matchMedia && !window.matchMedia("(min-width:640px)").matches;
}
/* The resting height is worked backwards from the plan: leave the map
   exactly as much room as its own 1170x658 shape needs at this width,
   and give the move list everything else. A phone screen is far taller
   than the theatre is deep, so splitting it down the middle would
   letterbox the plan into a thin band with dead space above and below
   it, and starve the list at the same time. */
function snapPx(i){
  var H = stageEl.clientHeight || 480;
  var W = stageEl.clientWidth || 375;
  var head = grabEl.offsetHeight || 74;
  var jump = $("jump").classList.contains("hide") ? 0 : ($("jump").offsetHeight || 0);
  var peek = head + jump + 1;
  var rest = Math.round(H - (W / (VB.w / VB.h)) - 6);
  /* The tallest snap takes the whole stage rather than leaving a sliver
     of map. A theatre squeezed into 80px is not a smaller map, it is a
     smear of overlapping labels — if you have pulled the list up this
     far, you are reading, not looking. */
  return [ peek, Math.max(peek, Math.min(Math.round(H*0.8), rest)), H ][i];
}
/* One number drives both the pane under the plan and the plan box
   above it, and it lives on the stage because both read it from there.
   Build mode swaps the sheet for the tray; the plan has to grow into
   the difference or it sits in a strip with dead black under it. */
function applyPanes(){
  if(!sheetOverlay()){ stageEl.style.removeProperty("--pane"); return; }
  var h = mode === "build" ? ($("buildpane").offsetHeight || 130) : snapPx(snap);
  stageEl.style.setProperty("--pane", h + "px");
}
function setSnap(i){
  snap = Math.max(0, Math.min(SNAPS.length-1, i));
  LS.set("snap", snap); applyPanes();
}

var sdrag = null;
grabEl.addEventListener("pointerdown", function(e){
  if(!sheetOverlay()) return;
  sdrag = { y:e.clientY, h:sheetEl.getBoundingClientRect().height, moved:false };
  sheetEl.classList.add("dragging");
  try{ grabEl.setPointerCapture(e.pointerId); }catch(err){}
});
grabEl.addEventListener("pointermove", function(e){
  if(!sdrag) return;
  var dy = sdrag.y - e.clientY;
  if(Math.abs(dy) > 5) sdrag.moved = true;
  var H = stageEl.clientHeight || 480;
  var h = Math.max(snapPx(0), Math.min(H, sdrag.h + dy));
  stageEl.style.setProperty("--pane", h + "px");
});
grabEl.addEventListener("pointerup", function(e){
  if(!sdrag) return;
  sheetEl.classList.remove("dragging");
  if(!sdrag.moved){                              // a tap steps to the next height
    setSnap(snap >= SNAPS.length-1 ? 0 : snap+1);
  } else {
    var h = sheetEl.getBoundingClientRect().height, best = 0, gap = Infinity;
    SNAPS.forEach(function(i){
      var d = Math.abs(snapPx(i) - h);
      if(d < gap){ gap = d; best = i; }
    });
    setSnap(best);
  }
  sdrag = null;
});
grabEl.addEventListener("keydown", function(e){
  if(e.key === "Enter" || e.key === " "){ e.preventDefault(); setSnap(snap >= SNAPS.length-1 ? 0 : snap+1); }
});

/* ---------------- topbar ---------------- */
function syncStatus(txt, cls){
  var c = $("syncchip");
  c.innerHTML = "";
  c.appendChild(ele("span", "word", txt));
  c.className = "stat" + (cls ? " " + cls : "");
  c.title = txt;
}
/* Unsaved outranks device-only, because it is the one the stage
   manager can still do something about. */
function syncChip(){
  if(apiState === "checking")      syncStatus("Connecting");
  else if(apiState === "readonly") syncStatus("View only", "warn");
  else if(dirty)                   syncStatus("Unsaved", "warn");
  else if(apiState === "local")    syncStatus("This device only", "warn");
  else                             syncStatus("Synced", "ok");
}
function paintTop(){
  $("showname").textContent = S.show;
  document.body.classList.toggle("mode-build", mode === "build");
  $("buildpane").classList.toggle("hide", mode !== "build");
  $("scenesheet").classList.toggle("hide", mode === "build");
  $("planbtns").classList.toggle("hide", mode === "build");
  $("btn-setup").textContent = mode === "build" ? "Done" : "Setup";
  syncChip();
}

/* ---------------- the sheet header ---------------- */
function paintSheetHead(moves){
  var sc = sceneAt(viewIdx);
  var k = $("grab-k");
  k.textContent = browsing ? "Looking ahead" : "On stage now";
  k.className = "k" + (browsing ? " ahead" : "");
  $("grab-num").textContent = (viewIdx+1) + "/" + S.scenes.length;
  $("grab-nm").textContent = sc ? sc.name : "No scenes yet";
  $("grab-ct").textContent = moves.length
    ? moves.length + (moves.length === 1 ? " move" : " moves")
    : (viewIdx === 0 ? "preset" : "no change");

  var J = $("jump"); J.innerHTML = "";
  if(!browsing){ J.classList.add("hide"); return; }
  J.classList.remove("hide");
  var live = sceneAt(S.liveIndex);
  J.appendChild(ele("span", "t", "The show is on " + (S.liveIndex+1) + ". " + (live ? live.name : "—")));
  J.appendChild(mkbtn("Back to live", "btn", function(){
    browsing = false; viewIdx = S.liveIndex; selected = null; render();
  }));
  if(isSM()){
    J.appendChild(mkbtn("Call this one", "btn on", function(){ callScene(viewIdx); }));
  }
}

/* ---------------- move list ---------------- */
function paintMoves(moves){
  var box = $("moves"); box.innerHTML = "";
  if(!moves.length){
    var msg = viewIdx === 0
      ? "Scene 1 is the preset — where every piece starts before the house opens. Pinch the plan to look at it."
      : "Nothing moves into this scene. The stage stays exactly as it is.";
    box.appendChild(ele("div", "empty", msg));
    return;
  }
  moves.forEach(function(m){
    var d = ele("button", "mv" + (m.piece && selected === m.piece.id ? " sel" : ""));
    var sw = ele("div", "sw");
    var tx = ele("div", "txt");
    if(m.kind === "curtain"){
      sw.style.background = m.cur.color;
      var cn = ele("div", "nm");
      cn.appendChild(ele("span", "verb", m.verb));
      cn.appendChild(document.createTextNode(m.text));
      tx.appendChild(cn);
      tx.appendChild(ele("div", "path", m.sub));
      d.appendChild(sw); d.appendChild(tx); box.appendChild(d);
      return;
    }
    sw.style.background = m.piece.color;
    var nm = ele("div", "nm");
    nm.appendChild(ele("span", "verb", VERB[m.kind]));
    nm.appendChild(document.createTextNode(m.piece.name));
    var path = ele("div", "path");
    function z(text, cls){ return ele("span", "z" + (cls ? " " + cls : ""), text); }
    if(m.kind === "turn"){
      path.appendChild(z(zoneLabel(m.to)));
    } else {
      if(m.from) path.appendChild(z(zoneLabel(m.from)));
      if(m.r && m.r.via.length) m.r.via.forEach(function(v){
        path.appendChild(ele("span", "ar", "→")); path.appendChild(z(v, "via"));
      });
      if(m.from) path.appendChild(ele("span", "ar", "→"));
      path.appendChild(z(m.to ? zoneLabel(m.to) : "Out of play"));
    }
    if(m.turned){
      path.appendChild(ele("span", "ar", "·"));
      path.appendChild(z(turnText(m.from, m.to), "via"));
    }
    tx.appendChild(nm); tx.appendChild(path);
    if(m.to && m.to.note) tx.appendChild(ele("div", "hint", m.to.note));
    d.appendChild(sw); d.appendChild(tx);
    d.addEventListener("click", function(){
      selected = (selected === m.piece.id) ? null : m.piece.id;
      render();
    });
    box.appendChild(d);
  });
}

function paintNote(){
  var sc = sceneAt(viewIdx), box = $("notebox");
  if(!sc || !sc.note){ box.classList.add("hide"); box.innerHTML = ""; return; }
  box.classList.remove("hide"); box.innerHTML = "";
  var b = ele("b", null, curtainSummary(sc) + " · scene note");
  box.appendChild(b);
  box.appendChild(document.createTextNode(sc.note));
}

/* ---------------- the deck ----------------
   Hick's law: during a run only three things are reachable — go
   back, go forward, look ahead. The primary target never changes
   slot, so the thumb learns one location and stops aiming. */
function paintDeck(){
  var D = $("deck");
  D.innerHTML = ""; D.className = "deck";

  /* Building: one target, and its label is the verb. The status goes
     on the small line above it — a primary button reading "Up to date"
     is the biggest thing on the screen and names no action at all. */
  if(mode === "build"){
    D.classList.add("one");
    var save = ele("button", "go");
    save.disabled = calling;
    save.innerHTML = '<span class="k">'
      + (dirty ? "Not on the other devices yet" : "Everything is saved") + "</span>"
      + '<span class="v">' + (dirty ? "Save &amp; sync" : "Back to the show") + "</span>";
    save.addEventListener("click", function(){
      if(dirty) publish().then(function(ok){ if(ok) toast("Sent to every device."); render(); });
      else setMode("run");
    });
    D.appendChild(save);
    return;
  }

  var L = ele("div", "l"), R = ele("div");
  D.appendChild(L); D.appendChild(R);
  function sec(icon, cap, fn, dis){
    var b = ele("button", "sec");
    b.disabled = !!dis;
    b.innerHTML = '<span class="ic">' + icon + '</span><span class="cap">' + cap + "</span>";
    b.addEventListener("click", fn);
    L.appendChild(b);
    return b;
  }

  var live = sceneAt(S.liveIndex), next = sceneAt(S.liveIndex+1);

  if(isSM()){
    if(browsing) sec("&#9679;", "Live", function(){
      browsing = false; viewIdx = S.liveIndex; selected = null; render();
    });
    else sec("&#9664;", "Back", function(){ callScene(S.liveIndex-1); }, S.liveIndex <= 0);

    var go = ele("button", "go");
    go.disabled = !next || calling;
    if(calling){
      go.innerHTML = '<span class="k">Sending to every device</span><span class="v">Calling&hellip;</span>';
      R.appendChild(go);
      return;
    }
    go.innerHTML = '<span class="k">' + (next ? "Call next scene" : "End of show") + "</span>"
      + '<span class="v">'
      + (next ? '<span class="num">' + (S.liveIndex+2) + "</span>" + esc(next.name)
              : '<span class="num">' + (S.liveIndex+1) + "</span>" + esc(live ? live.name : "—"))
      + "</span>";
    go.addEventListener("click", function(){ callScene(S.liveIndex+1); });
    R.appendChild(go);
    return;
  }

  /* Crew: browse freely, call nothing. */
  sec("&#9664;", "Back", function(){
    viewIdx = Math.max(0, viewIdx-1); browsing = viewIdx !== S.liveIndex; selected = null; render();
  }, viewIdx <= 0);
  sec("&#9654;", "Ahead", function(){
    viewIdx = Math.min(S.scenes.length-1, viewIdx+1); browsing = viewIdx !== S.liveIndex;
    selected = null; render();
  }, viewIdx >= S.scenes.length-1);

  /* Same slot, same size as the stage manager's GO, but flat and
     unclickable so nobody taps the show forward by accident.

     While the crew are on the live scene the sheet above already
     names it, so repeating it here would waste the biggest readable
     thing on the screen. It carries what is coming instead — which is
     what you want to know while you are waiting in a wing. Step away
     from live and it switches to where the show actually is. */
  var ro = ele("div", "readout" + (browsing ? " away" : ""));
  var show = browsing ? { k:"The show is on", i:S.liveIndex, sc:live }
                      : { k: next ? "Next up" : "Last scene",
                          i: next ? S.liveIndex+1 : S.liveIndex,
                          sc: next || live };
  ro.innerHTML = '<span class="k">' + show.k + "</span>"
    + '<span class="v"><span class="num">' + (show.i+1) + "</span>"
    + esc(show.sc ? show.sc.name : "—") + "</span>";
  R.appendChild(ro);
}

/* A call that did not reach the other devices must not be a toast
   that fades. It stays until the SM retries or accepts it. */
function paintAlert(){
  var a = $("alert");
  if(callFail === null){ a.classList.add("hide"); a.innerHTML = ""; return; }
  a.classList.remove("hide"); a.innerHTML = "";
  var sc = sceneAt(callFail);
  a.appendChild(ele("div", "msg",
    "Not sent — the crew is still on the scene before this one. You are on "
    + (callFail+1) + ". " + (sc ? sc.name : "") + "; their phones are not."));
  var retry = ele("button", null, "Send again");
  retry.addEventListener("click", async function(){
    retry.disabled = true; retry.textContent = "Sending…";
    S.liveStamp = Date.now();
    var ok = await publish();
    if(ok) callFail = null;
    render();
  });
  var dismiss = ele("button", null, "Call it by headset");
  dismiss.addEventListener("click", function(){ callFail = null; render(); });
  a.appendChild(retry); a.appendChild(dismiss);
}

/* ===== src/parts/40-build.js ===== */
/* ===============================================================
   Build mode — where the stage manager makes the show.

   A separate screen, not a mode bleeding through the run screen.
   The plan fills it, the scenes run along the top, the set pieces
   run along the bottom, and a tapped piece opens its inspector in
   between. Nothing is nested more than one tap deep.
   =============================================================== */

function setMode(m){
  if(m === "build" && !isSM()){ toast("Only the stage manager can build the show."); return; }
  mode = m;
  selected = null;
  render();
  /* The pane under the plan changes size between the two screens, so
     the map has to be re-clamped to the box it now has. */
  applyPanes();
  refit();
}

/* ---------------- scenes along the top ---------------- */
function paintSceneBar(){
  var bar = $("scenebar");
  if(mode !== "build"){ bar.innerHTML = ""; return; }
  bar.innerHTML = "";
  S.scenes.forEach(function(sc, i){
    var b = ele("button", "chip" + (i === viewIdx ? " cur" : "") + (i === S.liveIndex ? " live" : ""));
    b.appendChild(ele("div", "n", (i+1) + (i === S.liveIndex ? " · LIVE" : "")));
    b.appendChild(ele("div", "t", sc.name + (i === viewIdx ? "  ▾" : "")));
    b.addEventListener("click", function(){
      /* Tapping another scene goes to it. Tapping the one you are
         already on opens its details — one chip, two obvious jobs. */
      if(i === viewIdx){ sceneSheet(); return; }
      viewIdx = i; browsing = i !== S.liveIndex; selected = null; render();
    });
    bar.appendChild(b);
  });
  var add = ele("button", "chip add", "+");
  add.title = "Add a scene after this one";
  add.addEventListener("click", addSceneAfter);
  bar.appendChild(add);
  /* A show with a dozen scenes scrolls this bar off the end. Keep the
     one you are on in view, or switching scenes near the end of act 2
     means scrolling back every time the bar repaints. */
  var cur = bar.querySelector(".chip.cur");
  if(cur && cur.scrollIntoView) try{
    cur.scrollIntoView({ block:"nearest", inline:"center" });
  }catch(e){ /* older Safari: the default is fine */ }
}

function addSceneAfter(){
  var base = sceneAt(viewIdx);
  var copy = { id: "s" + Date.now(), name: "New scene", note: "",
               place: base ? JSON.parse(JSON.stringify(base.place)) : {} };
  /* Every line set, not just the main one. Copying one and defaulting
     the rest to open meant a new scene silently called the mid curtain
     and the scrim back out. */
  CURTAINS.forEach(function(c){ copy[c.key] = curtainAt(base, c.key); });
  S.scenes.splice(viewIdx+1, 0, copy);
  if(S.liveIndex > viewIdx) S.liveIndex++;
  viewIdx += 1; browsing = viewIdx !== S.liveIndex;
  markDirty(); render();
  toast("Copied from the scene before it. Move what changes.");
}
function moveScene(dir){
  var j = viewIdx + dir;
  if(j < 0 || j >= S.scenes.length) return;
  var liveId = (S.scenes[S.liveIndex] || {}).id;
  var tmp = S.scenes[viewIdx]; S.scenes[viewIdx] = S.scenes[j]; S.scenes[j] = tmp;
  viewIdx = j;
  for(var k=0;k<S.scenes.length;k++) if(S.scenes[k].id === liveId) S.liveIndex = k;
  browsing = viewIdx !== S.liveIndex;
  markDirty(); render();
}

/* ---------------- the scene you are editing ----------------
   Name, curtain and note, in reach without opening anything. These
   are what a stage manager changes on nearly every pass, and burying
   them behind a modal was most of what made building feel like work.
   The chip's own sheet keeps the rarer, riskier ones — reorder and
   delete. */
function paintSceneStrip(){
  var strip = $("scenestrip");
  if(mode !== "build"){ strip.innerHTML = ""; return; }
  var sc = sceneAt(viewIdx);
  strip.innerHTML = "";
  if(!sc) return;

  var nm = document.createElement("input");
  nm.type = "text"; nm.value = sc.name; nm.placeholder = "Name this scene";
  nm.setAttribute("aria-label", "Scene name");
  nm.addEventListener("input", function(){
    sc.name = nm.value; markDirty(); paintSceneBar(); paintDeck();
  });
  strip.appendChild(nm);

  strip.appendChild(curtainSeg(sc));

  var note = document.createElement("input");
  note.type = "text"; note.className = "note";
  note.value = sc.note || "";
  note.placeholder = "What the crew needs to know for this scene";
  note.setAttribute("aria-label", "Scene note");
  note.addEventListener("input", function(){ sc.note = note.value; markDirty(); });
  strip.appendChild(note);
  /* Reorder and delete are rarer and riskier, so they stay one tap in. */
  strip.appendChild(mkbtn("More…", "btn sm", sceneSheet));
}

/* One control for all three line sets. Each button says which curtain
   it is and what state it is in, and tapping it flips that one — a
   segmented control with a name and a state is self-describing, where
   a row of lit and unlit names leaves you guessing which way round it
   reads in the dark. */
function curtainSeg(sc){
  var seg = ele("div", "seg curtains");
  CURTAINS.forEach(function(c){
    var open = curtainAt(sc, c.key) === "open";
    var b = ele("button", open ? null : "on");
    b.appendChild(ele("span", "cn", c.short));
    b.appendChild(ele("span", "cs", open ? "open" : "closed"));
    b.title = c.name + " is " + (open ? "open" : "closed");
    b.addEventListener("click", function(){
      sc[c.key] = open ? "closed" : "open";
      markDirty(); render();
    });
    seg.appendChild(b);
  });
  return seg;
}

/* ---------------- set pieces along the bottom ---------------- */
function paintTray(){
  var tray = $("tray");
  if(mode !== "build"){ tray.innerHTML = ""; return; }
  tray.innerHTML = "";
  var sc = sceneAt(viewIdx);
  S.pieces.forEach(function(p){
    var inScene = !!(sc && sc.place[p.id]);
    var b = ele("button", "pchip" + (inScene ? "" : " out") + (selected === p.id ? " sel" : ""));
    var sw = ele("div", "sw"); sw.style.background = p.color;
    b.appendChild(sw);
    b.appendChild(document.createTextNode(p.name));
    b.title = inScene ? "Select on the plan" : "Bring into this scene";
    b.addEventListener("click", function(){
      selected = p.id;
      if(!inScene) leaveAsWas();
      else render();
    });
    tray.appendChild(b);
  });
  var add = ele("button", "pchip add", "+ New piece");
  add.addEventListener("click", newPieceSheet);
  tray.appendChild(add);
}

function newPieceSheet(){
  var name = "", w = "", h = "";
  modal("Add a set piece", function(body, close){
    body.appendChild(ele("div", "help",
      "Its footprint on the deck, in feet. 6, 6' and 6' 3\" all work; a bare "
      + "number is feet. Measured against a " + fmtFeet(stageFeet()) + " wide stage."));
    var r1 = ele("div", "row");
    var l1 = ele("label", "f"); l1.appendChild(ele("span", null, "Name"));
    var i1 = document.createElement("input"); i1.type = "text"; i1.placeholder = "Kitchen table";
    l1.appendChild(i1); r1.appendChild(l1); body.appendChild(r1);
    var r2 = ele("div", "row");
    [["Width", "5'"], ["Depth", "3'"]].forEach(function(o){
      var l = ele("label", "f"); l.appendChild(ele("span", null, o[0]));
      var i = document.createElement("input"); i.type = "text"; i.inputMode = "decimal";
      i.placeholder = o[1];
      l.appendChild(i); r2.appendChild(l);
    });
    body.appendChild(r2);
    var r3 = ele("div", "row"); r3.style.marginTop = "14px";
    r3.appendChild(mkbtn("Cancel", "btn", close));
    r3.appendChild(mkbtn("Add piece", "btn on", function(){
      name = i1.value.trim();
      if(!name){ toast("Give the piece a name first."); i1.focus(); return; }
      var ins = r2.querySelectorAll("input");
      var wf = parseFeet(ins[0].value), hf = parseFeet(ins[1].value);
      w = clampSz(toUnits(wf === null ? 5 : wf));
      h = clampSz(toUnits(hf === null ? 3 : hf));
      var p = { id:"p"+Date.now(), name:name, w:w, h:h,
                color: PALETTE[S.pieces.length % PALETTE.length] };
      S.pieces.push(p);
      var sc = sceneAt(viewIdx);
      if(sc) sc.place[p.id] = { zone:"wingSR", x:0.5, y:0.5, r:0, note:"" };
      selected = p.id;
      close(); markDirty(); render();
      toast("Parked in wing SR. Drag it where it lives.");
    }));
    body.appendChild(r3);
    setTimeout(function(){ i1.focus(); }, 30);
  });
}

/* ---------------- the piece menu ----------------
   Opened from the small handle beside a selected piece, and shown as
   a sheet over everything. It was tried two other ways first: floated
   next to the piece, where the form was taller than the strip of map
   it covered; and docked under the plan, where it shrank the map every
   time you touched a piece. Both were worse than a sheet you asked for
   and can dismiss, which costs the map nothing until you open it. */
function pieceMenu(){
  var sc = sceneAt(viewIdx), p = pieceById(selected);
  if(!p) return;
  var pl = sc ? sc.place[selected] : null;

  modal(p.name, function(body, close){
    var pop = ele("div", "insp");

    var hd = ele("div", "hd");
    var sw = ele("div", "sw"); sw.style.background = p.color;
    hd.appendChild(sw);
    hd.appendChild(ele("span", "tag", zoneLabel(pl)));
    pop.appendChild(hd);

    /* Send it somewhere without dragging. On a phone this is the fast
       path: the director says "put the bench on the aux stage" and it
       is one tap, not a drag across a zoomed map. */
    var seg = ele("div", "seg");
    [["stage","Stage"],["wingSR","Wing SR"],["wingSL","Wing SL"],["aux","Aux"]].forEach(function(o){
      var b = ele("button", pl && pl.zone === o[0] ? "on" : null, o[1]);
      b.addEventListener("click", function(){ sendToZone(o[0]); close(); pieceMenu(); });
      seg.appendChild(b);
    });
    pop.appendChild(seg);

    if(pl){
      var rn = ele("div", "row notebox");
      var ln = ele("label", "f"); ln.appendChild(ele("span", null, "Note for the crew"));
      var inp = document.createElement("input"); inp.type = "text";
      inp.value = pl.note || "";
      inp.placeholder = "upstage of leg 2";
      inp.addEventListener("input", function(){ pl.note = inp.value; markDirty(); });
      ln.appendChild(inp); rn.appendChild(ln); pop.appendChild(rn);
    }

    /* Size is typed, not dragged: a resize handle on the plan sits right
       where a thumb lands, and a set piece that quietly changed size was
       the thing that kept going wrong.

       A size belongs to the piece, not to this placement — a sofa is one
       sofa in every scene — so a change here changes it everywhere, on
       purpose. The angle belongs to the placement, because the same sofa
       genuinely does face different ways in different scenes. */
    var rs = ele("div", "row");
    [["Width","w"],["Depth","h"]].forEach(function(o){
      var l = ele("label", "f size"); l.appendChild(ele("span", null, o[0]));
      var i = document.createElement("input");
      i.type = "text"; i.inputMode = "decimal";
      i.value = fmtFeet(toFeet(p[o[1]]));
      i.addEventListener("change", function(){
        var ft = parseFeet(i.value);
        if(ft === null){ i.value = fmtFeet(toFeet(p[o[1]])); return; }
        p[o[1]] = clampSz(toUnits(ft));
        i.value = fmtFeet(toFeet(p[o[1]]));      // show the clamped value back
        markDirty(); drawPieces(sceneAt(viewIdx));
      });
      l.appendChild(i); rs.appendChild(l);
    });
    if(pl){
      var lt = ele("label", "f size"); lt.appendChild(ele("span", null, "Turn"));
      var it = document.createElement("input");
      it.type = "text"; it.inputMode = "numeric";
      it.value = normAngle(pl.r || 0) + "°";
      it.addEventListener("change", function(){
        var m = String(it.value).match(/-?[0-9.]+/);
        pl.r = m ? normAngle(parseFloat(m[0])) : 0;
        it.value = pl.r + "°";
        markDirty(); render();
      });
      lt.appendChild(it); rs.appendChild(lt);
    }
    pop.appendChild(rs);

    var r2 = ele("div", "row");
    if(pl){
      r2.appendChild(mkbtn("Straighten", "btn sm", function(){
        pl.r = 0; markDirty(); render(); close(); pieceMenu();
      }));
      /* Not "take it out of play" — a piece sitting in a wing is still
         in the show, it just does not move for this scene. Inheriting
         the previous placement is what makes the diff produce no move
         at all, which is the thing the crew actually wants. */
      r2.appendChild(mkbtn("Same as last scene", "btn sm", function(){
        leaveAsWas(); close();
      }));
      r2.appendChild(mkbtn("Off for this scene", "btn sm hot", function(){
        delete sc.place[selected]; markDirty(); render(); close();
        toast("Struck. The crew will be told to take it off.");
      }));
    } else {
      r2.appendChild(mkbtn("Bring into this scene", "btn on", function(){
        leaveAsWas(); close();
      }));
    }
    pop.appendChild(r2);

    var done = ele("div", "row"); done.style.marginTop = "12px";
    done.appendChild(mkbtn("Done", "btn on wide", close));
    pop.appendChild(done);
    body.appendChild(pop);
  });
}

function sendToZone(zid){
  var sc = sceneAt(viewIdx); if(!sc || !selected) return;
  var cur = sc.place[selected] || { r:0, note:"" };
  sc.place[selected] = { zone:zid, x:0.5, y:0.5, r:cur.r||0, note:cur.note||"" };
  markDirty(); render();
}
function leaveAsWas(){
  var sc = sceneAt(viewIdx), prev = sceneAt(viewIdx-1);
  if(!sc || !selected) return;
  var src = prev && prev.place[selected];
  if(src){
    sc.place[selected] = { zone:src.zone, x:src.x, y:src.y, r:src.r||0, note:src.note||"" };
    toast("Stays where it was in “" + prev.name + "” — no move for the crew.");
  } else {
    sc.place[selected] = { zone:"wingSR", x:0.5, y:0.5, r:0, note:"" };
    toast("Nothing earlier to follow — parked in wing SR.");
  }
  markDirty(); render();
}

          path += " → " + (m.to ? zoneLabel(m.to) : "out of play");
        }

      });

      var ol2 = document.createElement("ol");
      S.pieces.forEach(function(p){

          + (pl.note ? "  (" + pl.note + ")" : "")));

/* ===== src/parts/50-sync.js ===== */
/* ===============================================================
   Sync, and the two backstage settings.

   There is no server. To sync, the page rebuilds its own source
   with the new show spliced in and republishes itself through the
   artifact runtime; every other open view live-reloads to that
   version. Propagation is a second or three plus a reload, which
   is fine for calling scene changes and is not sub-second cueing.

   Editing never publishes on its own. Changes collect in a local
   draft and go out on an explicit Save. Calling a scene publishes
   immediately, because that is the whole point of calling it.
   =============================================================== */

function markDirty(){
  dirty = true;
  LS.set("draft", { baseRev:S.rev, state:S });
  syncChip(); paintDeck();
}
function clearDraft(){ dirty = false; LS.set("draft", null); }

async function publish(){
  if(!api){
    toast("No live sync in this view — the change is saved on this device only.");
    return false;
  }
  syncStatus("Sending");
  S.rev = (S.rev || 1) + 1;
  try{
    await api.publish(pageSource(S));
    clearDraft();
    return true;
  }catch(err){
    S.rev = S.rev - 1;
    var code = (err && err.code) || "upstream_error";
    if(code === "conflict"){
      syncStatus("Reloading", "warn");
      toast("Someone else saved first — this device is reloading to their version.");
    } else if(code === "not_writer" || code === "not_granted"
           || code === "consent_required" || code === "not_declared"){
      apiState = "readonly"; api = null;
      toast("This device can view but not save. Ask whoever owns the link to send you an edit link.");
      render();
    } else if(code === "rate_limited"){
      syncStatus("Too fast", "warn");
      toast("Saving too quickly. Wait a few seconds, then try again.");
    } else if(code === "too_large"){
      syncStatus("Too big", "warn");
      toast("The show file is too large to save. Remove a few scenes or pieces.");
    } else {
      syncStatus("Save failed", "warn");
      toast("Save failed. Your work is kept on this device — try again in a moment.");
    }
    return false;
  }
}

async function callScene(i){
  if(calling) return;                        // one tap, one call
  if(i < 0 || i >= S.scenes.length) return;
  S.liveIndex = i; S.liveStamp = Date.now();
  viewIdx = i; browsing = false; selected = null;
  calling = true; callFail = null;
  render();
  syncStatus("Calling");
  var ok = await publish();
  calling = false;
  if(!ok) callFail = i;                      // this device moved; the others did not
  render();
}

/* ---------- backstage: keep the screen awake ---------- */
var wakeLock = null, wakeWanted = LS.get("wake", false), wakeOk = ("wakeLock" in navigator);
async function applyWake(){
  try{
    if(wakeWanted && wakeOk){
      if(!wakeLock){
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release", function(){ wakeLock = null; });
      }
    } else if(wakeLock){ await wakeLock.release(); wakeLock = null; }
  }catch(e){
    wakeWanted = false; LS.set("wake", false);
    toast("This browser will not keep the screen awake. Set your phone's auto-lock to Never for the run.");
  }
}
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState === "visible" && wakeWanted && !wakeLock) applyWake();
});

/* ---------- backstage: dim the screen ---------- */
var DIMS = [
  { label:"Bright",   a:0,    tint:false },
  { label:"Dim",      a:0.5,  tint:false },
  { label:"Blackout", a:0.78, tint:true  }
];
var dimIdx = LS.get("dim", 0), forcedDark = false;
function applyDim(){
  var d = $("dim"), s = DIMS[dimIdx];
  d.style.opacity = s.a;
  d.className = s.tint ? "tint" : "";
  if(dimIdx > 0 && !forcedDark){
    document.documentElement.setAttribute("data-theme", "dark"); forcedDark = true;
  } else if(dimIdx === 0 && forcedDark){
    document.documentElement.removeAttribute("data-theme"); forcedDark = false;
  }
}

/* ---------- wiring ---------- */
buildPlan();

$("btn-setup").addEventListener("click", function(){
  if(mode === "build") setMode("run"); else setupSheet();
});
$("btn-replay").addEventListener("click", replay);
$("btn-fit").addEventListener("click", fitView);

/* The plan's box changes size for a lot of reasons — the sheet being
   dragged, a rotation, the keyboard opening, the window resizing. One
   observer on the box covers all of them; anything less leaves the map
   drawn for a size it is no longer. */
var reflowT = null;
function reflow(){
  clearTimeout(reflowT);
  reflowT = setTimeout(refit, 60);
}
if(window.ResizeObserver) new window.ResizeObserver(reflow).observe(plansvg);
window.addEventListener("resize", function(){ applyPanes(); reflow(); });
window.addEventListener("orientationchange", function(){ setTimeout(function(){ applyPanes(); reflow(); }, 120); });

/* A hardware keyboard, which an iPad in the booth usually has. */
document.addEventListener("keydown", function(e){
  if(e.target && /input|textarea/i.test(e.target.tagName)) return;
  if(e.key === "Escape"){
    var scrim = document.querySelector(".scrim");
    if(scrim){ scrim.remove(); return; }
    if(selected){ selected = null; render(); return; }
    if(mode === "build"){ setMode("run"); return; }
  }
  if(!isSM() || mode === "build" || browsing) return;
  if(e.key === "ArrowRight" || e.key === " "){ e.preventDefault(); callScene(S.liveIndex+1); }
  if(e.key === "ArrowLeft") callScene(S.liveIndex-1);
});

/* ---------- start ----------
   The sheet is sized before the first render, so the plan is fitted
   to the box it will actually occupy. Animating it open from the
   stylesheet default would fit the map to a box that is still moving,
   and leave the theatre floating in dead space until something else
   forced a redraw.

   Fitting happens synchronously rather than in a frame callback: a
   page opened in a background tab gets no frames at all, and would
   come to the front with the theatre fitted to a box it never had. */
sheetEl.classList.add("noanim");
applyPanes();
render();
fitView();
applyDim();
if(wakeWanted) applyWake();
askRole(false);
setTimeout(function(){ sheetEl.classList.remove("noanim"); }, 60);

/* A scene the stage manager just called plays its change once, so a
   phone that was face-down in a wing shows what it missed. */
if(S.liveStamp && S.liveStamp !== lastSeen){
  LS.set("lastSeen", S.liveStamp);
  if(S.liveIndex === viewIdx) setTimeout(replay, 160);
}

(async function(){
  try{
    var cap = await (window.claude && window.claude.use
      ? window.claude.use("artifact") : Promise.resolve(null));
    if(cap){ api = cap; apiState = "live"; } else { apiState = "local"; }
  }catch(e){ apiState = "local"; }
  syncChip();
})();

/* A handle for the test suite, and for poking at a running show from
   a console. Nothing inside the app reads it. */
window.GL = {
  get S(){ return S; },
  get view(){ return view; },
  get viewIdx(){ return viewIdx; },
  pageSource: pageSource,
  parseFeet: parseFeet,
  fmtFeet: fmtFeet,
  toFeet: toFeet,
  toUnits: toUnits,
  angleTo: angleTo,
  curtainSummary: curtainSummary,
  CURTAINS: CURTAINS,
  movesBetween: movesBetween,
  buildSheet: buildSheet,
  callScene: callScene,
  render: render,
  pieceMenu: pieceMenu,
  select: function(id){ selected = id; render(); },
  setApi: function(a){ api = a; apiState = a ? "live" : "local"; syncChip(); }
};
})();
</script>
